/* ---------- storage: shared Firebase database, or this browser only ---------- */
const APP_VERSION="2.6.1 (02/10/2026)";
const COLS=["models","clients","orders","pos","grns","wos","issues","logs","fg","dispatches","components","cmoves","boms","mods"];
let MODE="local",FB=null,LAST={},READY=false,tsC=0,pendingR=false;
const did=id=>encodeURIComponent(String(id)).replace(/\./g,"%2E");
function stable(o){if(Array.isArray(o))return "["+o.map(stable).join(",")+"]";if(o&&typeof o==="object")return "{"+Object.keys(o).filter(k=>o[k]!==undefined).sort().map(k=>JSON.stringify(k)+":"+stable(o[k])).join(",")+"}";return JSON.stringify(o===undefined?null:o)}
const clean=o=>JSON.parse(JSON.stringify(o));
function setSync(state,msg){const el=$("#sync");if(!el)return;el.className="sync "+state;el.textContent=msg}
function save(){
  if(MODE!=="fb")return;
  if(!navigator.onLine){toast("No internet: this change was not sent to the cloud. Reload when back online.");setSync("bad","Offline · not saved");return}
  const ops=[];
  COLS.forEach(c=>{if(!canWrite(c))return;const cur=new Map();(S[c]||[]).forEach(r=>{if(r._ts==null)r._ts=Date.now()*1000+(tsC++%1000);const j=stable(r);cur.set(String(r.id),j);if((LAST[c]&&LAST[c].get(String(r.id)))!==j)ops.push(["set",c,r])});
    (LAST[c]||new Map()).forEach((j,id)=>{if(!cur.has(id))ops.push(["del",c,id])});LAST[c]=cur});
  const fj=stable(S.forecast||{});if(canWrite("__meta")&&fj!==LAST.__f){ops.push(["meta"]);LAST.__f=fj}
  if(!ops.length)return;
  setSync("busy","Saving…");
  const jobs=[];for(let i=0;i<ops.length;i+=400){const b=FB.writeBatch(FB.db);ops.slice(i,i+400).forEach(([t,c,r])=>{
    if(t==="set")b.set(FB.doc(FB.db,"pf_"+c,did(r.id)),clean(r));else if(t==="del")b.delete(FB.doc(FB.db,"pf_"+c,did(r)));else b.set(FB.doc(FB.db,"pf_meta","settings"),{forecast:clean(S.forecast||{months:3,avg:{}})})});jobs.push(b.commit())}
  Promise.all(jobs).then(()=>setSync("ok","Saved to cloud")).catch(e=>{setSync("bad","Not saved");toast("Could not save to the shared database: "+e.message)});
}
const busyInput=()=>{const a=document.activeElement;return !!(a&&a.closest&&a.closest("#app")&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))};
function liveRender(){if(!READY)return;if(busyInput()){pendingR=true;return}render()}
document.addEventListener("focusout",()=>{if(pendingR)setTimeout(()=>{if(!busyInput()){pendingR=false;render()}},60)});
function startFirebase(){
  const got=new Set(),need=COLS.length+1;
  const done=k=>{got.add(k);if(!READY&&got.size>=need){READY=true;migrate();render();setSync(navigator.onLine?"ok":"bad",navigator.onLine?"Cloud · live":"Offline · view only")}else liveRender()};
  S=blankState();
  COLS.forEach(c=>FB.onSnapshot(FB.collection(FB.db,"pf_"+c),snap=>{const arr=snap.docs.map(d=>d.data()).sort((a,b)=>(a._ts||0)-(b._ts||0));S[c]=arr;LAST[c]=new Map(arr.map(r=>[String(r.id),stable(r)]));done(c)},e=>fatal("Could not read "+c+": "+e.message)));
  FB.onSnapshot(FB.doc(FB.db,"pf_meta","settings"),d=>{S.forecast=d.exists()&&d.data().forecast?d.data().forecast:{months:3,avg:{}};LAST.__f=stable(S.forecast);done("__meta")},e=>fatal("Could not read settings: "+e.message));
}
function fatal(msg){$("#app").innerHTML=`<section class="card"><div class="card-h"><h2>Cannot reach the shared database</h2><p>${esc(msg)}</p></div><div class="card-b">Check the internet connection, the Firebase settings in <b>firebase-config.js</b>, and the Firestore rules (see README). Then reload the page.</div></section>`;setSync("bad","Not connected")}
function setupNeeded(){$("#app").innerHTML=`<section class="card"><div class="card-h"><h2>Cloud database not set up</h2><p>This app keeps all data in the company's Firebase cloud database only. Nothing is stored on this device.</p></div><div class="card-b">Admin: fill in <b>firebase-config.js</b> with the Firebase project settings and upload it to GitHub (see README, Step 1). Then reload this page.</div></section>`;setSync("bad","Not connected")}
window.addEventListener("online",()=>{setSync("ok","Cloud · live");if(READY)render()});window.addEventListener("offline",()=>{setSync("bad","Offline · view only");if(READY)render();toast("Internet lost. Viewing only until it is back.")});

/* ---------- department sign-in ---------- */
const LOGIN_DOMAIN=((window.APP_SETTINGS||{}).loginDomain||"ronch-floor.app").replace(/^@/,"");
const ROLE_INFO={admin:"Everything, opening data import, delete all",sales:"Sub-vendor POs, price, specification, clients",scm:"Component POs, MRP, forecast",store:"GRN, issue to WOs, component stock",production:"Work orders, stage output, FG handover",dispatch:"Dispatch to sub-vendors, invoices",rnd:"Models, components, BOMs, modifications"};
function loginScreen(local,msg){return new Promise(res=>{$("#login")&&$("#login").remove();
  let last="";try{last=localStorage.getItem("pf-lastdept")||""}catch(_){}
  document.body.insertAdjacentHTML("beforeend",`<div class="ov" id="login" style="background:var(--bg);align-items:flex-start;overflow:auto"><form class="modal" id="lf" style="width:min(560px,100%);margin:24px auto">
    <div style="text-align:center;padding:18px 16px 6px;background:#fff;border-radius:12px 12px 0 0"><img src="${LOGO_FULL}" alt="Ronch Excel Industries Pvt Ltd" style="width:min(220px,60%);height:auto"></div><h3 style="text-align:center">Production Floor · Sign in</h3><div style="padding:14px 16px;display:grid;gap:12px">
    <div class="hint">Choose your department. Everyone can view all data; each department changes only its own work. Admin can change everything.</div>
    <div class="deptgrid" role="radiogroup" aria-label="Department">${Object.entries(ROLES).map(([k,v])=>`<button type="button" class="dept${k===last?" on":""}" data-dept="${k}" role="radio" aria-checked="${k===last}"><b>${v}</b><span>${ROLE_INFO[k]||""}</span></button>`).join("")}</div>
    <input type="hidden" id="lDept" value="${esc(last)}">
    ${local?`<div class="hint">Test mode: not connected to the shared database, so no password is asked.</div>`:`<div class="fl"><label for="lPw" id="lPwL">Password${last?" for "+esc(ROLES[last]||""):""}</label><input id="lPw" type="password" autocomplete="current-password"></div>`}
    <div class="err" id="le">${esc(msg||"")}</div><button class="btn" id="lGo">Sign in</button></div></form></div>`);
  const pick=k=>{$("#lDept").value=k;document.querySelectorAll("#login .dept").forEach(x=>{const on=x.dataset.dept===k;x.classList.toggle("on",on);x.setAttribute("aria-checked",on)});
    if($("#lPwL"))$("#lPwL").textContent="Password for "+ROLES[k];$("#le").textContent="";if($("#lPw"))$("#lPw").focus()};
  document.querySelectorAll("#login .dept").forEach(x=>x.onclick=()=>pick(x.dataset.dept));
  if(last&&$("#lPw"))$("#lPw").focus();
  $("#lf").onsubmit=async e=>{e.preventDefault();const d=$("#lDept").value;if(!d){$("#le").textContent="Tap your department first.";return}try{localStorage.setItem("pf-lastdept",d)}catch(_){}
    if(local){try{sessionStorage.setItem("pf-role",d)}catch(_){}ROLE=d;$("#login").remove();res(d);return}
    if(!$("#lPw").value){$("#le").textContent="Enter the password for "+ROLES[d]+".";$("#lPw").focus();return}
    const b=$("#lGo");b.disabled=true;b.textContent="Signing in…";
    try{await FB.signIn(d+"@"+LOGIN_DOMAIN,$("#lPw").value);$("#login").remove();res(d)}catch(x){b.disabled=false;b.textContent="Sign in";
      $("#le").textContent=/invalid|wrong|credential|not-found/i.test(x.code||x.message)?"Wrong password for "+ROLES[d]+".":/network/i.test(x.code||"")?"No internet connection.":/too-many/i.test(x.code||"")?"Too many tries. Wait a few minutes and try again.":(x.message||String(x))}}})}
function changePwForm(){if(!FB||!FB.changePw){toast("Password change needs the cloud database.");return}
  modal("Change password · "+ROLES[ROLE],`<div class="hint">Changes the password of the <b>${ROLES[ROLE]}</b> login for everyone in this department. Tell your team the new one.</div>
    <div class="fl"><label for="pOld">Current password</label><input id="pOld" type="password" autocomplete="current-password"></div>
    <div class="fl"><label for="pNew">New password</label><input id="pNew" type="password" autocomplete="new-password"><div class="hint">At least 6 characters. Use letters and numbers.</div></div>
    <div class="fl"><label for="pNew2">New password again</label><input id="pNew2" type="password" autocomplete="new-password"></div>`);
  $("#pOld").focus();$("#mf button[type=submit]").textContent="Change password";
  $("#mf").onsubmit=async e=>{e.preventDefault();const o=$("#pOld").value,n=$("#pNew").value,n2=$("#pNew2").value,er=$("#merr");
    if(!o)return er.textContent="Enter the current password.";if(n.length<6)return er.textContent="The new password must have at least 6 characters.";
    if(n!==n2)return er.textContent="The two new passwords do not match.";if(n===o)return er.textContent="The new password is the same as the current one.";
    const b=$("#mf button[type=submit]");b.disabled=true;b.textContent="Changing…";
    try{await FB.changePw(o,n);closeModal();toast("Password changed for "+ROLES[ROLE])}
    catch(x){b.disabled=false;b.textContent="Change password";const c=String(x.code||x.message||x);
      er.textContent=/wrong-password|invalid-credential|invalid-login/i.test(c)?"The current password is wrong.":/weak-password/i.test(c)?"Firebase says the new password is too weak. Use a longer one.":/too-many/i.test(c)?"Too many tries. Wait a few minutes.":/network/i.test(c)?"No internet connection.":c}}}
async function signOutNow(){if(FB)await FB.signOut();location.reload()}
async function boot(){
  $("#app").innerHTML='<div class="empty" style="padding:60px">Loading…</div>';
  const fb=await window.FB_PROMISE;
  if(fb&&fb.error){fatal(fb.error);return}
  if(!fb){setupNeeded();return}
  FB=fb;MODE="fb";let started=false;
  FB.onAuth(async u=>{if(!u){if(!started)loginScreen(false);else location.reload();return}
    const r=String(u.email||"").split("@")[0];if(!ROLES[r]){await FB.signOut();loginScreen(false,"This account is not a department login.");return}
    ROLE=r;if(!started){started=true;startFirebase()}});
}
/* ---------- detail drawer ---------- */
let DR=null;
const kp=items=>`<div class="kp">${items.map(([l,v])=>`<div><span>${l}</span><strong>${v}</strong></div>`).join("")}</div>`;
const D={
model(id){const m=model(id);if(!m)return null;const pp=planP(id),b=bomOfModel(id),bs=S.boms.filter(x=>x.product===id);
  const ws=S.wos.filter(w=>w.product===id).reverse(),dc=S.dispatches.filter(d=>d.product===id).reverse().slice(0,10);
  return {t:m.id,kind:"Model",b:`<div class="sub">${esc(m.cat)}${m.code?" · "+esc(custName(m.code)):""}${m.desc?" · "+esc(m.desc):""}</div>`+
  kp([["Ordered",num(pp.demand)],["In WOs",num(pp.inWO)],["WIP",num(wipProd(id))],["FG",num(pp.fg)],["To plan",num(pp.toPlan)],["Avg / month",num(S.forecast.avg[id]||0)]])+
  `<div class="acts">${pp.toPlan?`<button class="btn sm" data-a="club" data-id="${esc(id)}">Club ${num(pp.toPlan)} into WO</button>`:""}${b?`<button class="btn sm ghost" data-open="bom:${b.id}">Open BOM ${esc(b.no)}</button>`:`<button class="btn sm" data-a="bomNew" data-id="${esc(id)}">+ Create BOM</button>`}<button class="btn sm ghost" data-a="model" data-id="${esc(id)}">Edit model</button></div>`+
  card("BOMs",bs.length?"":"No BOM yet","",bs.length?table([{h:"BOM",f:x=>`<b>${esc(x.no)}</b>`},{h:"Type",f:x=>isSub(x)?"Sub":"Main"},{h:"Rev",f:x=>esc(x.rev)},{h:"Status",f:x=>bomPill(x.status)},{h:"Lines",n:1,f:x=>x.items.length},{h:"Mods",n:1,f:x=>modsOf(x.id).length},{h:"",f:x=>`<button class="btn sm ghost" data-a="bomPdf" data-id="${x.id}|main">PDF</button>`}],bs,"",x=>"bom:"+x.id):"")+
  card("Pending sub-vendor deliveries",`${num(pp.demand)} drivers`,"",table([{h:"Due",f:x=>dmy(x.o.due)},{h:"Order",f:x=>lnk("so",x.o.no)},{h:"Client → Sub-vendor",f:x=>`${esc(client(x.o.client).name)}<div class="sub">→ ${esc(vLabel(x.o.client,x.l.vendor))}</div>`},{h:"Spec",f:x=>specBox(specOf(x.l))},{h:"Pending",n:1,f:x=>num(x.pending)}],pp.pl,"Nothing pending."))+
  card("Work orders","","",table([{h:"WO",f:w=>lnk("wo",w.no)},{h:"Plan",n:1,f:w=>num(w.qty)},{h:"Materials",n:1,f:w=>num(woInfo(w).issued)},{h:"FG",n:1,f:w=>num(woInfo(w).handed)},{h:"Status",f:w=>woPill(woInfo(w).status)}],ws,"No work orders.",w=>"wo:"+w.no))+
  card("Recent dispatches","","",table([{h:"DC",cls:"id",f:d=>d.no},{h:"Date",f:d=>dmy(d.date)},{h:"Sub-vendor",f:d=>esc(vendor(d.client,d.vendor).name)},{h:"Qty",n:1,f:d=>num(d.qty)},{h:"Status",f:d=>dcPill(d.status)}],dc,"No dispatches."))}},
po(id){const p=S.pos.find(x=>x.id===id);if(!p)return null;const gs=S.grns.filter(g=>g.po===p.no).reverse();
  return {t:p.no,kind:"Purchase order",b:`<div class="ord-h"><b>${esc(p.supplier)}</b>${poPill(poStatus(p))}<span class="sub">PO ${dmy(p.date)} · ETA ${dmy(p.eta)}${p.ref?" · "+esc(p.ref):""} · ${esc(p.cur||"INR")}</span></div>`+
  kp([["Lines",p.lines.length],["Ordered",num(sum(p.lines,l=>l.qty))],["Received",num(sum(p.lines,l=>+l.recv||0))],["Open",num(sum(p.lines,poLineOpen))],["Value",num(Math.round(poValue(p)))]])+poActs(p)+
  card("Lines","","",table([{h:"Part No.",f:l=>`<b>${esc(l.part)}</b>`},{h:"Description",f:l=>`<span style="white-space:normal">${esc(cdesc(l.part))}</span>`},{h:"Ordered",n:1,f:l=>num(l.qty)},{h:"Received",n:1,f:l=>num(+l.recv||0)},{h:"Open",n:1,f:l=>poLineOpen(l)?`<b>${num(poLineOpen(l))}</b>`:"0"},{h:"Price",n:1,f:l=>l.price?num(l.price):"—"},{h:"Stock now",n:1,f:l=>num(cstock(l.part))}],p.lines,""))+
  card("Goods receipts","","",table([{h:"GRN",f:g=>`<b>${esc(g.no)}</b>`},{h:"Date",f:g=>dmy(g.date)},{h:"Invoice / DC",f:g=>esc(g.inv)},{h:"Lines",n:1,f:g=>g.lines.length},{h:"Received",n:1,f:g=>num(sum(g.lines,l=>l.qty))},{h:"Damaged",n:1,f:g=>num(sum(g.lines,l=>l.dmg))}],gs,"Nothing received yet."))}},
wo(no){const w=S.wos.find(x=>x.no===no);if(!w)return null;const i=woInfo(w);
  const rows=STAGES.map((s,k)=>{const inp=k===0?i.issued:i.st[k-1].pass;return {s:(k+1)+". "+s,inp,p:i.st[k].pass,f:i.st[k].fail,wait:inp-i.st[k].pass-i.st[k].fail}});
  const covers=S.orders.filter(o=>(w.covers||[]).includes(o.no)),iss=S.issues.filter(x=>x.wo===no).reverse();
  return {t:w.no,kind:"Work order",b:`<div class="ord-h"><b>${lnk("model",w.product)}</b>${woPill(i.status)}<span class="sub">started ${dmy(w.date)} · target ${dmy(w.target)}</span></div>`+
  `<div class="specbig">Specification: ${w.spec?esc(w.spec).replace(/ \| /g,"\n"):"Standard (none given in the client orders)"}</div>`+
  kp([["Planned",num(w.qty)],["Materials issued",num(i.issued)],["To issue",num(i.pendingIssue)],["WIP",num(i.wip)],["Rejected",num(i.rej)],["FG handed",num(i.handed)]])+
  `<div class="acts">${i.pendingIssue&&!w.closed?`<button class="btn sm" data-a="issue" data-id="${w.no}">Issue materials</button>`:""}${i.issued&&!w.closed?`<button class="btn sm" data-a="log" data-id="${w.no}">Log stage output</button>`:""}${i.canHand?`<button class="btn sm ghost" data-a="handover" data-id="${w.no}">Hand over ${num(i.canHand)} FG</button>`:""}<button class="btn sm ghost" data-a="closeWO" data-id="${w.id}">${w.closed?"Reopen":"Close"} WO</button></div>`+
  woBomCard(w)+card("Test stages","Waiting = came in from the previous stage, not yet tested","",table([{h:"Stage",f:r=>r.s},{h:"In",n:1,f:r=>num(r.inp)},{h:"Passed",n:1,f:r=>num(r.p)},{h:"Failed",n:1,f:r=>r.f?`<span style="color:var(--bad)">${num(r.f)}</span>`:"0"},{h:"Waiting",n:1,f:r=>r.wait?`<b style="color:var(--warn)">${num(r.wait)}</b>`:"0"}],rows,""))+
  card("Materials issued by Store","","",table([{h:"Issue",f:x=>`<b>${esc(x.no)}</b>`},{h:"Date",f:x=>dmy(x.date)},{h:"Units",n:1,f:x=>num(x.sets)},{h:"BOM",f:x=>esc(x.bom)},{h:"Lines",n:1,f:x=>x.lines.length},{h:"Short",f:x=>x.short&&x.short.length?`<span style="white-space:normal">${x.short.map(esc).join(", ")}</span>`:""}],iss,"Nothing issued yet."))+
  card("Client orders in this WO",covers.length?"":"Manual / stock WO","",covers.length?table([{h:"Order",f:o=>lnk("so",o.no)},{h:"Client",f:o=>esc(client(o.client).name)},{h:"Qty of this model",n:1,f:o=>num(sum(o.lines.filter(l=>l.product===w.product),l=>l.qty))},{h:"Due",f:o=>dmy(o.due)},{h:"Status",f:o=>soPill(orderStatus(o))}],covers,"",o=>"so:"+o.no):"")+
  card("Stage log","","",table([{h:"Date",f:l=>dmy(l.date)},{h:"Stage",f:l=>STAGES[l.stage]},{h:"Pass",n:1,f:l=>num(l.pass)},{h:"Fail",n:1,f:l=>num(l.fail)},{h:"By",f:l=>esc(l.by)}],S.logs.filter(l=>l.wo===no).reverse(),"No entries yet."))}},
so(no){const o=S.orders.find(x=>x.no===no);if(!o)return null;
  const pls=pendingLines().filter(x=>x.o.no===no),dc=S.dispatches.filter(d=>d.so===no).reverse(),ws=S.wos.filter(w=>(w.covers||[]).includes(no));
  return {t:o.no,kind:"Client order",b:orderBlock(o)+
  card("Still to deliver","","",table([{h:"Sub-vendor",f:x=>`<b>${esc(vendor(o.client,x.l.vendor).name)}</b><div class="sub">${esc(vendor(o.client,x.l.vendor).city)}</div>`},{h:"Model",f:x=>esc(x.l.product)+(specOf(x.l)?"<br>"+specBox(specOf(x.l)):"")},{h:"Pending",n:1,f:x=>num(x.pending)},{h:"FG now",n:1,f:x=>num(fgProd(x.l.product))},{h:"",f:x=>fgProd(x.l.product)>0?`<button class="btn sm" data-a="dispatch" data-id="${x.l.id}">Dispatch</button>`:pill("Waiting for FG","mute")}],pls,"Fully delivered."))+
  card("Work orders covering this order","","",table([{h:"WO",f:w=>lnk("wo",w.no)},{h:"Model",f:w=>esc(w.product)},{h:"Plan",n:1,f:w=>num(w.qty)},{h:"Status",f:w=>woPill(woInfo(w).status)}],ws,"Not clubbed into a WO yet.",w=>"wo:"+w.no))+
  card("Dispatches","","",table([{h:"DC",cls:"id",f:d=>d.no},{h:"Date",f:d=>dmy(d.date)},{h:"Sub-vendor",f:d=>esc(vendor(d.client,d.vendor).name)},{h:"Model",f:d=>esc(d.product)},{h:"Qty",n:1,f:d=>num(d.qty)},{h:"Invoice",f:d=>esc(d.inv)||pill("missing","warn")},{h:"Status",f:d=>dcPill(d.status)},{h:"",f:d=>`<button class="btn sm ghost" data-a="editDC" data-id="${d.id}">Update</button>`}],dc,"No dispatches yet."))}}
};
function openD(ref){const k=ref.indexOf(":");DR={k:ref.slice(0,k),id:ref.slice(k+1)};drawD()}
function closeD(){DR=null;drawD()}
function drawD(){const el=$("#drawer");if(!DR){el.innerHTML="";document.body.style.overflow="";return}
  const r=D[DR.k]&&D[DR.k](DR.id);if(!r){DR=null;el.innerHTML="";document.body.style.overflow="";return}
  const keep=el.querySelector(".drawer")?.scrollTop||0;
  el.innerHTML=`<div class="dov" data-close="1"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${r.kind} ${esc(r.t)}"><div class="dh"><div><div class="sub" style="text-transform:uppercase;letter-spacing:.8px">${r.kind}</div><h3>${esc(r.t)}</h3></div><button class="btn sm ghost" data-close="1">Close</button></div><div class="db">${r.b}</div></aside>`;
  el.querySelector(".drawer").scrollTop=keep;document.body.style.overflow="hidden";markLocks(el);
}

/* ---------- components, stock, BOMs, modifications (R&D) ---------- */
const CCATS=["IC","Transistor / MOSFET","Diode","Capacitor","Resistor","Inductor / Transformer","PCB","Connector / Wire","Enclosure / Mechanical","Potting / Consumable","Other"];
const CUNITS=["pcs","m","g","kg","ml","set"];
const bomById=id=>S.boms.find(b=>b.id===id);
const modsOf=bid=>S.mods.filter(m=>m.bom===bid);
function effBom(bom,mods){const items=bom.items.map(i=>({...i,_chg:""}));const warn=[];
  (mods||[]).forEach(m=>m.changes.forEach(c=>{const at=()=>items.findIndex(i=>i.part===c.part&&(!c.ref||!i.ref||i.ref===c.ref));
    if(c.type==="Add")items.push({part:c.newPart||c.part,qty:+c.qty||0,ref:c.ref||"",remarks:c.remarks||"",_chg:m.no+" added"});
    else{const k=at();if(k<0){warn.push(`${m.no}: ${c.part} not found in the BOM`);return}
      if(c.type==="Remove")items.splice(k,1);
      else if(c.type==="Replace")Object.assign(items[k],{part:c.newPart||items[k].part,spec:c.newPart&&c.newPart!==items[k].part?"":items[k].spec,qty:c.qty!==""&&c.qty!=null?+c.qty:items[k].qty,ref:c.ref||items[k].ref,remarks:c.remarks||items[k].remarks,_chg:`${m.no} replaced ${c.part}`});
      else if(c.type==="Change qty")Object.assign(items[k],{qty:+c.qty||0,_chg:`${m.no} qty ${items[k].qty} → ${+c.qty||0}`})}}));
  return {items,warn}}
const bomPill=s=>pill(s,{Released:"ok",Draft:"warn",Obsolete:"mute",Approved:"ok"}[s]||"mute");
const compList=()=>`<datalist id="compDL">${S.components.map(c=>`<option value="${esc(c.id)}">${esc(cdesc(c.id))}</option>`).join("")}</datalist>`;

function compMove(part){if(!S.components.length){toast("No components in the master yet");return}
  const T=[["Receipt",1],["Issue to production",-1],["Return from production",1],["Adjustment +",1],["Adjustment −",-1]];
  form("Component stock movement",[
    {k:"part",l:"Part No.",req:1,v:part||"",hint:part?cdesc(part)+" · stock "+num(cstock(part)):"Type or pick the part number"},
    {k:"type",l:"Movement",t:"select",o:T.map(t=>t[0]),half:1},{k:"qty",l:"Qty",t:"number",req:1,half:1},
    {k:"ref",l:"Reference",hint:"WO no., supplier invoice, reason"},{k:"date",l:"Date",t:"date",v:today()}],
    v=>{if(!comp(v.part))return "Part "+v.part+" is not in the component master.";if(!(v.qty>0))return "Enter a qty above 0.";
      const sg=T.find(t=>t[0]===v.type)[1];if(sg<0&&v.qty>cstock(v.part))return `Only ${num(cstock(v.part))} in stock.`;
      S.cmoves.push({id:uid(),date:v.date,part:v.part,qty:sg*v.qty,type:v.type,ref:v.ref,by:me()});toast(`${v.type}: ${num(v.qty)} × ${v.part}`)},
    ()=>{const i=$("#f_part");i.setAttribute("list","compDL");i.insertAdjacentHTML("afterend",compList());i.oninput=()=>{$("#h_part").textContent=comp(i.value)?cdesc(i.value)+" · stock "+num(cstock(i.value)):"Not in the component master"}})}

/* BOM editor */
function rowsEditor(kind,rows){
  const head=kind==="bom"?`<th>#</th><th>Component (Part No. or description)</th><th>Description</th><th>Specification</th><th class="n">Qty / unit</th><th>Unit</th><th>Ref. des.</th><th>Remarks</th><th></th>`
    :`<th>Change</th><th>Part No.</th><th>New Part No.</th><th class="n">Qty / unit</th><th>Ref. des.</th><th>Remarks</th><th></th>`;
  return `<div class="tw"><table class="mx" id="edT"><thead><tr>${head}</tr></thead><tbody>${rows.map(r=>edRow(kind,r)).join("")}</tbody></table></div>
    <div class="acts" style="margin-top:6px"><button type="button" class="btn sm ghost" data-er="1">+ Row</button><button type="button" class="btn sm ghost" data-er="5">+ 5 rows</button>
    ${kind==="bom"?"":`<button type="button" class="btn sm ghost" id="edImp">Import lines from Excel</button><input type="file" id="edFile" accept=".xlsx,.xls,.csv" hidden>`}<span class="sub" id="edNote"></span></div>${compList()}`}
const IS='style="text-align:left;font-family:var(--f-body);width:';
function edRow(kind,r={}){const x=esc;
  if(kind==="bom")return `<tr><td class="sub" data-sn></td><td><input list="compDL" data-f="part" value="${x(r.part||"")}" ${IS}150px" placeholder="type part no. or description"></td><td class="sub" data-desc style="white-space:normal;min-width:170px">${x(cdesc(r.part)||(r.part?"Not in component master":""))}</td>
    <td><input data-f="spec" value="${x(r.spec||"")}" ${IS}150px" placeholder="e.g. 10k 1% 0.25W"></td>
    <td class="n"><input type="number" step="any" min="0" data-f="qty" value="${x(r.qty??"")}"></td><td class="sub" data-unit>${x(comp(r.part)?.unit||"")}</td>
    <td><input data-f="ref" value="${x(r.ref||"")}" ${IS}110px"></td><td><input data-f="remarks" value="${x(r.remarks||"")}" ${IS}150px"></td><td><button type="button" class="btn sm danger" data-rm>✕</button></td></tr>`;
  return `<tr><td><select data-f="type">${["Add","Remove","Replace","Change qty"].map(t=>`<option ${t===r.type?"selected":""}>${t}</option>`).join("")}</select></td>
    <td><input list="compDL" data-f="part" value="${x(r.part||"")}" ${IS}120px" placeholder="part in BOM / to add"></td><td><input list="compDL" data-f="newPart" value="${x(r.newPart||"")}" ${IS}120px" placeholder="Replace only"></td>
    <td class="n"><input type="number" step="any" min="0" data-f="qty" value="${x(r.qty??"")}"></td><td><input data-f="ref" value="${x(r.ref||"")}" ${IS}100px"></td><td><input data-f="remarks" value="${x(r.remarks||"")}" ${IS}150px"></td><td><button type="button" class="btn sm danger" data-rm>✕</button></td></tr>`}
function wireEditor(kind){const tb=$("#edT tbody");
  $("#mf").addEventListener("click",e=>{const b=e.target.closest("[data-er],[data-rm]");if(!b)return;if(b.dataset.rm!=null){b.closest("tr").remove();return}for(let i=0;i<+b.dataset.er;i++)tb.insertAdjacentHTML("beforeend",edRow(kind))});
  const sn=()=>{if(kind==="bom")[...tb.rows].forEach((tr,i)=>{const c=tr.querySelector("[data-sn]");if(c)c.textContent=i+1})};sn();new MutationObserver(sn).observe(tb,{childList:true});
  const fill=(inp,final)=>{const tr=inp.closest("tr");let p=inp.value.trim();if(final&&p&&!comp(p)){const c=findPart(p,p);if(c){p=c.id;inp.value=p}}
    tr.querySelector("[data-desc]").textContent=cdesc(p)||(p?"Not in component master":"");tr.querySelector("[data-unit]").textContent=comp(p)?.unit||"";
    const sp=tr.querySelector('[data-f="spec"]');if(final&&sp&&!sp.value&&comp(p)?.value)sp.value=comp(p).value};
  tb.addEventListener("input",e=>{if(e.target.dataset.f==="part"&&kind==="bom")fill(e.target,!!comp(e.target.value.trim()))});
  tb.addEventListener("change",e=>{if(e.target.dataset.f==="part"&&kind==="bom")fill(e.target,true)});
  if($("#edImp"))$("#edImp").onclick=()=>{if(!window.XLSX){toast("Excel library did not load");return}$("#edFile").value="";$("#edFile").click()};
  if($("#edFile"))$("#edFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const wb=XLSX.read(await f.arrayBuffer());const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:""}).map(r=>{const o={};for(const k in r)o[k.replace(/\*/g,"").trim().toLowerCase()]=String(r[k]).trim();return o});
    let n=0;rows.forEach(r=>{const part=r["part no."]||r["part no"]||r["part number"]||r["part"];if(!part||/EXAMPLE/.test(part))return;n++;
      tb.insertAdjacentHTML("beforeend",edRow(kind,{type:r["change"]||"Add",part,newPart:r["new part no."]||r["new part no"]||"",qty:r["qty / unit"]||r["qty"]||r["quantity"]||"",ref:r["ref. des."]||r["ref des"]||r["reference"]||r["ref"]||"",remarks:r["remarks"]||""}))});
    [...tb.rows].forEach(tr=>{if(![...tr.querySelectorAll("input")].some(i=>i.value))tr.remove()});$("#edNote").textContent=`${pl(n,"line")} imported from ${f.name}`}catch(x){toast("Could not read that file: "+x.message)}}}
function readRows(){return [...$("#edT tbody").rows].map(tr=>{const o={};tr.querySelectorAll("[data-f]").forEach(i=>o[i.dataset.f]=i.value.trim());return o}).filter(o=>o.part||o.newPart)}

const nextRev=m=>{const ns=S.boms.filter(b=>b.product===m).map(b=>parseInt(String(b.rev).replace(/\D/g,""))).filter(n=>!isNaN(n));return "R"+(ns.length?Math.max(...ns)+1:0)};
function nextSub(main){const ns=subsOf(main.id).map(b=>parseInt(String(b.rev).replace(/^S/i,""))).filter(n=>!isNaN(n));return "S"+(ns.length?Math.max(...ns)+1:1)}
function bomForm(id,copy,forModel,forMain){const b0=id?bomById(id):null;const b=b0&&copy?{...b0,id:null,status:"Draft"}:b0;
  if(!S.models.length){toast("Add a model first: R&D / BOM → + Add model");return}
  const editing=b0&&!copy;const mains=S.boms.filter(x=>!isSub(x)&&x.status!=="Obsolete");
  let type=b?(isSub(b)?"Sub":"Main"):(forMain?"Sub":"Main");const par0=b&&isSub(b)?b.parent:(forMain||"");
  const sel=b?b.product:(forModel||F.model||"");
  const opts=S.models.map(m=>`<option value="${esc(m.id)}" ${m.id===sel?"selected":""}>${esc(m.id)}${m.desc?" · "+esc(m.desc):""}${bomOfModel(m.id)&&!editing?" (has main BOM)":""}</option>`).join("");
  const mOpts=mains.map(x=>`<option value="${x.id}" ${x.id===par0?"selected":""}>${esc(x.no)} · ${esc(x.title||x.product)}${x.status!=="Released"?" ("+x.status+")":""}</option>`).join("");
  modal(editing?"Edit BOM · "+b0.no:copy?"New revision of "+b0.no:"New BOM",`
    <div class="fl"><label>BOM type</label><div class="seg" id="bType">${["Main","Sub"].map(t=>`<label class="segb"><input type="radio" name="bType" value="${t}" ${t===type?"checked":""} ${editing?"disabled":""}> ${t} BOM</label>`).join("")}</div>
      <div class="hint" id="bTypeH"></div></div>
    <div class="row2" style="grid-template-columns:2fr 1fr"><div>
      <div class="fl" id="bMainBox"><label for="bModel">Model No.</label><select id="bModel">${sel?"":'<option value="">Select the model…</option>'}${opts}</select>
        <div class="hint">Model not in the list? <button type="button" class="lnk" id="bAddModel">+ Add model</button></div></div>
      <div class="fl" id="bSubBox"><label for="bParent">Main BOM</label><select id="bParent" ${editing?"disabled":""}>${par0?"":'<option value="">Select the main BOM…</option>'}${mOpts}</select><div class="hint" id="bParH"></div></div></div>
      <div class="fl"><label>BOM No. (auto)</label><div id="bNo" style="font:600 15px var(--f-mono);padding:9px 0">—</div><div class="hint" id="bRevH"></div></div></div>
    <div class="row2" style="grid-template-columns:2fr 1fr"><div class="fl"><label for="bTitle">BOM name</label><input id="bTitle" value="${esc(b?.title||"")}" placeholder="filled automatically, change if needed"></div><div class="fl"><label for="bSt">Status</label><select id="bSt">${["Draft","Released","Obsolete"].map(s=>`<option ${s===(b?.status||"Draft")?"selected":""}>${s}</option>`).join("")}</select></div></div>
    <div class="fl"><label for="bNotes">Notes</label><input id="bNotes" value="${esc(b?.notes||"")}" placeholder="e.g. what this sub BOM changes: 1050mA output, 0-10V dimming"></div>
    <div class="fl"><label>Components per unit</label><div class="hint">Type a Part No. or part of the description and pick from the list. Specification fills from the component master and can be changed. Only a <b>Released</b> BOM is used for planning and issue.</div>
      <div class="hint" id="bDiff" style="font-weight:600"></div>${rowsEditor("bom",b?b.items:[{},{},{},{},{}])}</div>`,true);
  wireEditor("bom");
  let titleAuto=!b?.title;
  const cur=()=>{type=document.querySelector('input[name=bType]:checked').value;return type};
  const par=()=>bomById($("#bParent").value);
  const numFor=()=>{if(cur()==="Sub"){const p=par();if(!p)return null;if(editing&&isSub(b0)&&b0.parent===p.id)return {rev:b0.rev,no:b0.no,model:p.product};const r=nextSub(p);return {rev:r,no:`${p.no}-${r}`,model:p.product}}
    const m=$("#bModel").value;if(!m)return null;const rev=editing&&!isSub(b0)&&m===b0.product?b0.rev:nextRev(m);return {rev,no:`BOM-${m}-${rev}`,model:m}};
  const editorEmpty=()=>!readRows().length;
  const loadMain=()=>{const p=par();if(!p)return;$("#edT tbody").innerHTML=p.items.map(i=>edRow("bom",i)).join("");$("#edNote").textContent=`${pl(p.items.length,"line")} copied from ${p.no}. Now change what this sub BOM needs.`};
  const diff=()=>{if(cur()!=="Sub"||!par()){$("#bDiff").textContent="";return}const rows=readRows().map(r=>({part:(comp(r.part)||findPart(r.part,r.part)||{id:r.part}).id,qty:+r.qty||0,spec:r.spec||""}));
    const d=bomDiff(par(),{items:rows});const c=t=>d.filter(x=>x.type===t).length;
    $("#bDiff").innerHTML=d.length?`Changes vs ${esc(par().no)}: ${[["Added",c("Added")],["Removed",c("Removed")],["Qty changed",c("Qty changed")],["Spec changed",c("Spec changed")]].filter(x=>x[1]).map(x=>x[0].toLowerCase()+" "+x[1]).join(" · ")}`:`<span class="sub">Same as ${esc(par().no)} so far – change parts, qty or specification for this sub BOM.</span>`};
  const upd=()=>{const t=cur();$("#bMainBox").style.display=t==="Main"?"":"none";$("#bSubBox").style.display=t==="Sub"?"":"none";
    $("#bTypeH").textContent=t==="Main"?"The standard BOM of a model. Planning and issue use the Released main BOM.":"A copy of a main BOM with small changes for different driver parameters. A work order can be built to it.";
    if(t==="Sub"&&!mains.length){$("#bParH").textContent="No main BOM yet. Create the main BOM first.";}
    else $("#bParH").innerHTML=t==="Sub"&&par()?`Model ${esc(par().product)} · <button type="button" class="lnk" id="bReload">Copy lines from ${esc(par().no)} again</button>`:"";
    const r=$("#bReload");if(r)r.onclick=()=>{loadMain();diff()};
    const n=numFor();$("#bNo").textContent=n?n.no:"—";$("#bRevH").textContent=n?(t==="Sub"?`Sub BOM ${n.rev} of ${par().no}`:`Revision ${n.rev}`):(t==="Sub"?"Select the main BOM":"Select a model");
    if(titleAuto&&n){if(t==="Sub")$("#bTitle").value=`${par().title||par().product} – sub BOM ${n.rev}`;else{const md=model(n.model);$("#bTitle").value=md?.desc?`${n.model} · ${md.desc}`:n.model}}
    diff()};
  document.querySelectorAll('input[name=bType]').forEach(r=>r.onchange=()=>{if(cur()==="Sub"&&par()&&editorEmpty())loadMain();upd()});
  $("#bParent").onchange=()=>{if(editorEmpty()||!editing)loadMain();upd()};
  $("#bModel").onchange=upd;$("#bTitle").oninput=()=>{titleAuto=!$("#bTitle").value};$("#edT").addEventListener("input",diff);$("#edT").addEventListener("change",diff);
  if(!b&&forMain&&par())loadMain();upd();
  $("#bAddModel").onclick=()=>{closeModal();modelForm()};
  $("#mf").onsubmit=e=>{e.preventDefault();const t=cur(),n=numFor();if(!n){$("#merr").textContent=t==="Sub"?"Select the main BOM.":"Select the model.";return}
    const items=readRows().map(r=>{const c=comp(r.part)||findPart(r.part,r.part);return {part:c?c.id:r.part,spec:r.spec||"",qty:+r.qty||0,ref:r.ref,remarks:r.remarks}});
    if(!items.length){$("#merr").textContent="Add at least one component.";return}if(items.some(i=>!(i.qty>0))){$("#merr").textContent="Every line needs a qty above 0.";return}
    const unk=[...new Set(items.filter(i=>!comp(i.part)).map(i=>i.part))];if(unk.length){$("#merr").textContent="Not in the component master: "+unk.join(", ")+". Add them in R&D / BOM → + Add component first.";return}
    if(S.boms.some(x=>x.no===n.no&&x!==b0)){$("#merr").textContent=n.no+" already exists.";return}
    const rec={no:n.no,product:n.model,rev:n.rev,type:t,parent:t==="Sub"?par().id:"",title:$("#bTitle").value.trim()||n.no,status:$("#bSt").value,notes:$("#bNotes").value.trim(),items,date:today(),by:me()};
    if(rec.status==="Released"&&t==="Main")S.boms.filter(x=>x.product===n.model&&!isSub(x)&&x.status==="Released"&&x!==b0).forEach(x=>{x.status="Obsolete"});
    if(editing)Object.assign(b0,rec);else S.boms.push({id:uid(),...rec});save();closeModal();render();toast(n.no+" saved"+(rec.status==="Released"?" and released":""))}}
function modForm(id,bomId){const m=id?S.mods.find(x=>x.id===id):null;if(!S.boms.length){toast("Create a BOM first");return}
  modal(m?"Edit modification · "+m.no:"New BOM modification",`

/* PDF export */
const COMPANY="RONCH EXCEL INDUSTRIES PVT LTD";
function pdfBomSection(d,b,title){const r=b.items;
  d.heading(title||"Bill of materials");
  d.info([["BOM No.",b.no],["Type",isSub(b)?"Sub BOM":"Main BOM"],["Model",b.product],["Description",(model(b.product)||{}).desc||""],["Title",b.title],["Revision",b.rev],["Status",b.status],["Date",dmy(b.date)],["Prepared by",b.by],["Lines",String(r.length)],...(b.notes?[["Notes",b.notes]]:[])]);
  d.table(BOMC,r.map((i,k)=>bomRow(i,k)));}
const BOMC=[{h:"S.No",w:30,align:"right"},{h:"Part No.",w:82},{h:"Description",w:170},{h:"Category",w:72},{h:"Make (preferred / alternates)",w:118},{h:"Specification",w:92},{h:"Qty / unit",w:46,align:"right"},{h:"Unit",w:32},{h:"Ref. des.",w:74},{h:"Remarks",w:70}];

function pdfModSection(d,b,m){d.page();d.heading(`Modification ${m.no}: ${m.title}`);

function applyComps(res,fname){
  res.add.forEach(({id,f})=>S.components.push({id,desc:f.desc,cat:f.cat||"Other",unit:f.unit||"pcs",minStock:f.minStock===""?0:f.minStock,remarks:f.remarks,value:f.value,pkg:f.pkg,make:f.make,alts:f.alts}));
  res.upd.forEach(({c,f})=>{for(const k of ["desc","cat","unit","remarks","value","pkg","make"])if(f[k])c[k]=f[k];if(f.minStock!=="")c.minStock=f.minStock;if(f.alts.length)c.alts=f.alts});
  res.stk.forEach(s=>S.cmoves.push({id:uid(),date:today(),part:s.p,qty:s.d,type:s.d>0&&!S.cmoves.some(m=>m.part===s.p)?"Opening stock":"Import stock count",ref:`${fname} → ${s.n}`,by:me()}));
}
document.addEventListener("change",async e=>{if(!/^compFile/.test(e.target.id)||!e.target.files[0])return;const f=e.target.files[0];
  let res;try{res=parseComps(XLSX.read(await f.arrayBuffer(),{cellDates:true}))}catch(x){res={err:["Could not read this file: "+(x.message||x)],warn:[]}}
  const sample=(res.add||[]).slice(0,8).map(a=>`<tr><td><b>${esc(a.id)}</b></td><td>${esc(a.f.desc)}</td><td>${esc(a.f.cat)}</td></tr>`).join("");
  modal("Import components",`<div class="hint">${esc(f.name)} · importing as <b>${ROLES[ROLE]}</b></div>
    ${res.add?kp([["New components",res.add.length],["Updated",res.upd.length],["Stock changes",res.stk.length],["Problems",res.err.length]]):""}
    ${sample?`<div class="hint">New part numbers${res.add.length>8?" (first 8)":""}:</div><div class="tw"><table class="mx"><tbody>${sample}</tbody></table></div>`:""}
    ${res.err.length?`<div class="note" style="background:var(--bad-bg)"><span><b style="color:var(--bad)">Fix these rows and import again. Nothing has been changed.</b><br>${res.err.slice(0,40).map(esc).join("<br>")}${res.err.length>40?"<br>…":""}</span></div>`:""}
    ${res.warn.length?`<div class="hint">${res.warn.map(esc).join("<br>")}</div>`:""}
    ${!res.err.length?'<div class="hint">Existing components are matched by Part No., or by Description when Part No. is blank. Blank cells leave the current value unchanged.</div>':""}`,true);
  const b=$("#mf button[type=submit]");b.textContent=res.err.length?"Close":"Import";
  $("#mf").onsubmit=ev=>{ev.preventDefault();if(res.err.length)return closeModal();applyComps(res,f.name);save();closeModal();render();
    toast(`Components: ${res.add.length} new, ${res.upd.length} updated, ${res.stk.length} stock changes`)}});
/* ---------- render ---------- */
function drawFilters(){
  $("#fm").innerHTML=`<option value="">All models</option>`+S.models.map(k=>`<option ${k.id===F.model?"selected":""}>${esc(k.id)}</option>`).join("");
  $("#fc").innerHTML=`<option value="">All clients</option>`+S.clients.map(c=>`<option value="${c.id}" ${c.id===F.client?"selected":""}>${esc(c.name)}</option>`).join("");
  $("#fbar").classList.toggle("on",filtered());$("#fclr").hidden=!filtered();
}
function render(){
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button role="tab" aria-selected="${k===tab}" data-tab="${k}">${l}</button>`).join("");
  drawFilters();
  const fnote=filtered()?`<div class="note"><span class="fnote">Showing only: ${[F.model&&"model "+esc(F.model),F.client&&esc(client(F.client).name),F.q&&"“"+esc(F.q)+"”"].filter(Boolean).join(" · ")}</span></div>`:"";
  const start=(!S.models.length||!S.components.length)&&tab!=="setup"?card("Start here","Set up in this order. The Excel imports can be repeated to add or correct data.",`<button class="btn ghost" data-go="setup">Masters</button>`,importSteps()):"";
  $("#app").innerHTML=fnote+start+V[tab]();
  markLocks($("#app"));markLocks($("#tabs"));
  drawD();
}
function sortTh(th){const tb=th.closest("table").tBodies[0];const idx=[...th.parentNode.children].indexOf(th);
  const dir=th.dataset.dir==="asc"?"desc":"asc";th.parentNode.querySelectorAll("th").forEach(x=>delete x.dataset.dir);th.dataset.dir=dir;
  const key=tr=>{const t=(tr.children[idx]?.innerText||"").trim().split("\n")[0];const d=t.match(/^(\d{2})\/(\d{2})\/(\d{4})/);if(d)return +(d[3]+d[2]+d[1]);if(t==="—")return -Infinity;const n=t.replace(/[,%\s]/g,"");return /^-?\d+(\.\d+)?$/.test(n)?+n:t.toLowerCase()};
  const rows=[...tb.rows].sort((a,b)=>{const x=key(a),y=key(b);const c=typeof x===typeof y?(x>y?1:x<y?-1:0):(typeof x==="number"?-1:1);return dir==="asc"?c:-c});
  rows.forEach(r=>tb.appendChild(r));}
document.addEventListener("click",e=>{
  if(e.target.closest("#modalRoot"))return;
  const t=e.target.closest("[data-tab],[data-go],[data-a],[data-del],[data-open],[data-close],th[data-s]");if(!t)return;
  if(t.matches("th[data-s]"))return sortTh(t);
  if(t.dataset.close)return closeD();
  if(t.dataset.open)return openD(t.dataset.open);
  if(t.dataset.tab||t.dataset.go){DR=null;tab=t.dataset.tab||t.dataset.go;try{localStorage.setItem(KEY+"-tab",tab)}catch(_){}render();window.scrollTo(0,0);return}
  if(t.dataset.del){if(!okFor(DEL_OWN[t.dataset.del])){toast("View only · "+ROLES[DEL_OWN[t.dataset.del]]+" edits this");return}return A.del(t.dataset.del,t.dataset.id)}
  const a=t.dataset.a,id=t.dataset.id;if(!can(a)){toast(navigator.onLine?"View only · "+ownerName(a)+" edits this":"No internet. Changes are paused until the connection is back.");return}
  if(a==="grn")return A.grn(null);
  A[a](id);
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if($("#modalRoot").innerHTML)return closeModal();if(DR)return closeD()}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches('[tabindex="0"][data-open],[tabindex="0"][data-go],[tabindex="0"][data-a]')){e.preventDefault();e.target.click()}
});
let qT;$("#fq").addEventListener("input",()=>{clearTimeout(qT);qT=setTimeout(()=>{F.q=$("#fq").value.trim();render()},200)});
$("#fm").addEventListener("change",()=>{F.model=$("#fm").value;render()});
$("#fc").addEventListener("change",()=>{F.client=$("#fc").value;render()});
$("#fclr").addEventListener("click",()=>{F.q=F.model=F.client="";$("#fq").value="";render()});
try{const u=JSON.parse(localStorage.getItem(KEY+"-user")||"{}");if(u.n)$("#uName").value=u.n}catch(e){}
$("#uName").addEventListener("change",()=>{try{localStorage.setItem(KEY+"-user",JSON.stringify({n:$("#uName").value}))}catch(e){}});
$("#signOut").addEventListener("click",signOutNow);$("#chgPw").addEventListener("click",changePwForm);
$("#appVer").textContent=APP_VERSION;boot();
</script>
