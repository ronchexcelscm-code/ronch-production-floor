<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ronch Production Floor</title>
<meta name="theme-color" content="#00517d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky brand bar + department tabs; each department is a work surface of action buttons, a status summary and ledgers. Material flow reads left→right: SCM → Store → Production → Dispatch */
:root{
  --bg:#f3f6f8; --panel:#ffffff; --ink:#14222c; --muted:#5b6b77; --line:#dbe3e9; --soft:#e9eff3;
  --brand:#00517d; --brand-ink:#ffffff; --green:#35941e;
  --ok:#2c7d19; --ok-bg:#e4f3de; --warn:#9a5b00; --warn-bg:#fdf0d8; --bad:#b3261e; --bad-bg:#fbe3e1; --info:#00517d; --info-bg:#e0eef6;
  --f-disp:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e161c; --panel:#15212a; --ink:#e3ebf0; --muted:#94a6b3; --line:#27363f; --soft:#1c2a34;
  --brand:#4fa3d1; --brand-ink:#06131b; --green:#6cc653;
  --ok:#7fd666; --ok-bg:#1d3318; --warn:#f0b457; --warn-bg:#3a2a10; --bad:#ff8a80; --bad-bg:#3d1a18; --info:#7cc0e6; --info-bg:#132c3b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e161c; --panel:#15212a; --ink:#e3ebf0; --muted:#94a6b3; --line:#27363f; --soft:#1c2a34;
  --brand:#4fa3d1; --brand-ink:#06131b; --green:#6cc653;
  --ok:#7fd666; --ok-bg:#1d3318; --warn:#f0b457; --warn-bg:#3a2a10; --bad:#ff8a80; --bad-bg:#3d1a18; --info:#7cc0e6; --info-bg:#132c3b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:34px;height:34px;border-radius:7px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font:700 17px var(--f-disp);letter-spacing:-.5px;white-space:nowrap}
.mark b{color:var(--green);filter:brightness(1.25)}
.logo h1{font:700 19px/1 var(--f-disp);margin:0;letter-spacing:.3px}
.logo small{display:block;font:500 11px var(--f-body);color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-top:3px}
.who{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.who select,.who input{font:inherit;padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);max-width:130px}
nav{max-width:1200px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav button{font:600 15px var(--f-disp);letter-spacing:.4px;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:9px 12px 8px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
main{max-width:1200px;margin:0 auto;padding-block:18px 60px;padding-inline:16px;display:grid;gap:18px}
.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.flow div{padding:12px 14px;border-right:1px solid var(--line);position:relative;min-width:0}
.flow div:last-child{border-right:0}
.flow div:not(:last-child)::after{content:"";position:absolute;right:-7px;top:50%;width:12px;height:12px;background:var(--panel);border-top:1px solid var(--line);border-right:1px solid var(--line);transform:translateY(-50%) rotate(45deg);z-index:1}
.flow span{font:600 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.flow strong{display:block;font:600 26px/1.15 var(--f-mono);font-variant-numeric:tabular-nums;margin-top:4px}
.flow em{font-style:normal;font-size:12.5px;color:var(--muted)}
@media (max-width:980px){.flow{grid-template-columns:repeat(3,1fr)}.flow div{border-bottom:1px solid var(--line)}.flow div::after{display:none}}
@media (max-width:720px){.flow{grid-template-columns:1fr 1fr}.flow div{border-bottom:1px solid var(--line)}.flow div::after{display:none}}
section.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}
.card-h h2{font:700 17px var(--f-disp);letter-spacing:.3px;margin:0 auto 0 0;text-transform:uppercase}
.card-h p{margin:0;width:100%;color:var(--muted);font-size:13px}
.card-b{padding:12px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font:600 11.5px var(--f-body);text-transform:uppercase;letter-spacing:.7px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13.5px}
td.id{font-family:var(--f-mono);font-size:13px;color:var(--brand)}
.empty{color:var(--muted);padding:18px 14px;text-align:center}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font:600 12px var(--f-body);letter-spacing:.2px}
.p-ok{background:var(--ok-bg);color:var(--ok)}.p-warn{background:var(--warn-bg);color:var(--warn)}.p-bad{background:var(--bad-bg);color:var(--bad)}.p-info{background:var(--info-bg);color:var(--info)}.p-mute{background:var(--soft);color:var(--muted)}
.btn{font:600 14px var(--f-body);padding:7px 13px;border-radius:7px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.stages{display:grid;grid-template-columns:repeat(4,minmax(70px,1fr));gap:6px;min-width:300px}
.stg{font-size:11px;color:var(--muted)}
.stg .tr{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin:3px 0}
.stg .tr i{display:block;height:100%;background:var(--green)}
.stg b{font:600 12px var(--f-mono);color:var(--ink)}
.stg .f{color:var(--bad)}
.alerts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:8px;background:var(--soft);font-size:14px}
.alerts li .pill{flex:none;margin-top:1px}
.note{font-size:13px;color:var(--muted);background:var(--info-bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note span{margin-right:auto}
/* modal */
.ov{position:fixed;inset:0;background:rgba(8,18,26,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--panel);color:var(--ink);border-radius:12px;width:min(520px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line)}
.modal h3{font:700 19px var(--f-disp);text-transform:uppercase;letter-spacing:.3px;margin:0;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal form{padding:14px 16px;display:grid;gap:11px}
.fl{display:grid;gap:4px}
.fl label{font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.fl input,.fl select,.fl textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);width:100%}
.fl .hint{font-size:12.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.err{color:var(--bad);font-size:13.5px;min-height:1em}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding-top:4px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:60}
.sub{font-size:12.5px;color:var(--muted)}
.modal.wide{width:min(860px,100%)}
.mx input{width:84px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:500 13.5px var(--f-mono);text-align:right}
.mx td,.mx th{padding:6px 8px}
.mx tfoot td{font-weight:600;border-top:1px solid var(--line)}
.cell{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.cell.done{color:var(--ok)}
.cell i{font-style:normal;color:var(--muted)}
.ord{display:grid;gap:10px}
.ord-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ord-h .id{font:600 14px var(--f-mono);color:var(--brand)}
.ord-h .acts{margin-left:auto}
.ord+.ord{border-top:1px dashed var(--line);padding-top:14px;margin-top:4px}
.flow .ft{cursor:pointer;transition:background .15s}
.flow .ft:hover,.flow .ft:focus-visible{background:var(--soft);outline:none}
.flow .ft:hover::after{background:var(--soft)}
.flow .ft em::after{content:" →";opacity:0;transition:opacity .15s}
.flow .ft:hover em::after{opacity:1}
.alerts li[data-open],.alerts li[data-a],.alerts li[data-go]{cursor:pointer;transition:background .15s}
.alerts li[data-open]:hover,.alerts li[data-a]:hover,.alerts li[data-go]:hover{background:var(--info-bg)}
.alerts li .go{margin-left:auto;color:var(--brand);font-weight:600;font-size:13px;white-space:nowrap}
tr[data-open]{cursor:pointer}
tr[data-open]:hover td{background:var(--soft)}
.lnk{all:unset;cursor:pointer;font:500 13px var(--f-mono);color:var(--brand);border-bottom:1px dotted currentColor}
.lnk:hover{border-bottom-style:solid}
.lnk:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
th[data-s]{cursor:pointer;user-select:none}
th[data-s]:hover{color:var(--ink)}
th[data-dir="asc"]::after{content:" ▲";font-size:9px}
th[data-dir="desc"]::after{content:" ▼";font-size:9px}
.fbar{max-width:1200px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)}
.fbar input,.fbar select{font:inherit;font-size:14px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);min-width:0}
.fbar input{flex:1 1 220px}
.fbar select{flex:0 1 200px}
.fbar.on input,.fbar.on select{border-color:var(--brand)}
.fnote{font-size:13px;color:var(--brand);font-weight:600}
.dov{position:fixed;inset:0;background:rgba(8,18,26,.4);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--bg);z-index:41;overflow:auto;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:-12px 0 30px rgba(0,0,0,.18)}
.dh{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;z-index:2}
.dh h3{font:700 19px var(--f-disp);letter-spacing:.3px;margin:0 auto 0 0;text-transform:uppercase}
.db{padding:14px 16px 40px;display:grid;gap:14px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.kp div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.kp span{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.kp strong{display:block;font:600 19px var(--f-mono);font-variant-numeric:tabular-nums}
.spec{display:inline-block;margin-top:3px;padding:2px 8px;border-radius:6px;background:var(--warn-bg);color:var(--warn);font-size:12.5px;font-weight:600;white-space:normal;max-width:360px;line-height:1.35}
.specbig{padding:10px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-weight:600;white-space:pre-wrap}
[hidden]{display:none!important}
.vchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vchip{padding:4px 10px;border-radius:99px;background:var(--info-bg);color:var(--info);font-weight:600;font-size:13px}
.sync{font:600 12px var(--f-body);padding:3px 9px;border-radius:99px;white-space:nowrap}.sync.ok{background:var(--ok-bg);color:var(--ok)}.sync.busy{background:var(--warn-bg);color:var(--warn)}.sync.bad{background:var(--bad-bg);color:var(--bad)}
.locked{opacity:.38;cursor:not-allowed!important}
.rolebadge{font:700 12px var(--f-body);padding:3px 10px;border-radius:99px;background:var(--brand);color:var(--brand-ink);white-space:nowrap}
.ofgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;align-items:end}
.appver{text-align:center;color:var(--muted);font-size:12px;padding:10px 0 24px}
@media (max-width:720px){header{position:static}.bar{padding-block:8px}.logo small{display:none}.logo h1{font-size:16px}.who{flex-wrap:wrap}.fbar input{flex-basis:100%}.fbar select{flex:1 1 45%}
  .row2{grid-template-columns:1fr!important}.modal{max-height:92vh}.modal h3{font-size:17px}.fl,.modal form>*{min-width:0}.mfoot{position:sticky;bottom:0;background:var(--panel);padding-block:8px}
  .card-h h2{font-size:15.5px}.drawer{width:100%}}
.ofdet>summary{cursor:pointer;font-weight:600;color:var(--brand);padding:4px 0;list-style:none}.ofdet>summary::-webkit-details-marker{display:none}.ofdet>summary::before{content:"▸ ";}.ofdet[open]>summary::before{content:"▾ "}
.grp td{background:var(--soft);font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo"><div class="mark"><span>r<b>e</b></span></div><div><h1>RONCH PRODUCTION FLOOR</h1><small>LED Driver · Models &amp; BOM Flow</small></div></div>
    <span class="sync busy" id="sync">Connecting…</span><div class="who"><span class="rolebadge" id="roleBadge"></span><label for="uName">Name</label><input id="uName" placeholder="Your name"><button type="button" class="btn sm ghost" id="signOut">Sign out</button></div>
  </div>
  <nav role="tablist" id="tabs"></nav>
  <div class="fbar" id="fbar"><input id="fq" type="search" placeholder="Search order, WO, PO, sub-vendor, invoice, docket…" aria-label="Search"><select id="fm" aria-label="Filter by model"></select><select id="fc" aria-label="Filter by client"></select><button class="btn sm ghost" id="fclr" hidden>Clear filters</button><span style="margin-left:auto;display:flex;gap:6px"><button class="btn sm ghost" data-a="exportTab">Export this tab</button><button class="btn sm" data-a="exportAll">Export all (Excel)</button></span></div>
</header>
<main id="app"></main>
<div class="appver">Ronch Production Floor · version <span id="appVer"></span></div>
<div id="drawer"></div>
<div id="modalRoot"></div>
<input type="file" id="impFileG" accept=".xlsx,.xls" hidden>

<script src="firebase-config.js"></script>
<script>window.FB_PROMISE=(async()=>{const cfg=window.FIREBASE_CONFIG;
  if(!cfg||!cfg.apiKey||/PASTE/.test(cfg.apiKey))return null;
  try{
    const V="10.12.2",B="https://www.gstatic.com/firebasejs/"+V+"/";
    const [{initializeApp},au,fs]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
    const app=initializeApp(cfg);
    let db;try{db=fs.initializeFirestore(app,{localCache:fs.memoryLocalCache()})}catch(e){db=fs.getFirestore(app)}
    const auth=au.getAuth(app);
    return {db,collection:fs.collection,doc:fs.doc,onSnapshot:fs.onSnapshot,writeBatch:fs.writeBatch,
      onAuth:cb=>au.onAuthStateChanged(auth,cb),signIn:(e,p)=>au.signInWithEmailAndPassword(auth,e,p),signOut:()=>au.signOut(auth),
      changePw:async(oldP,newP)=>{const u=auth.currentUser;await au.reauthenticateWithCredential(u,au.EmailAuthProvider.credential(u.email,oldP));await au.updatePassword(u,newP)}};
  }catch(e){return {error:(e&&e.message)||String(e)}}
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const STAGES=["PCBA Test","Hi-pot & Ground","Ageing","Final Test"];
const PO_FLOW=["Ordered","Shipped","At Port / Customs"];   /* manual shipping steps; Part received / Received are worked out from GRNs */
const DC_FLOW=["Packed","Dispatched","In Transit","Delivered"];
const KEY="ronch-pf-local-v1";
let S;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const dmy=d=>d?d.split("-").reverse().join("/"):"—";
const num=n=>(+n||0).toLocaleString("en-IN");
const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const uid=()=>Math.random().toString(36).slice(2,9);
function nextNo(prefix,list,field){const y=new Date().getFullYear();let n=list.filter(x=>String(x[field]).startsWith(prefix+"-"+y)).length+1;let no;do{no=`${prefix}-${y}-${String(n++).padStart(3,"0")}`}while(list.some(x=>x[field]===no));return no}
function me(){return ($("#uName").value.trim()||"—")+" ("+(ROLES[ROLE]||"—")+")"}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
const pl=(n,w)=>n+" "+w+(n===1?"":"s");
const pill=(t,k)=>`<span class="pill p-${k}">${esc(t)}</span>`;

/* ---------- models ----------
   A model is one sellable driver version, e.g. 24W-C7 (Crompton, version 7) or 24W-B7 (Bajaj). Each model has its own component BOM. */
const CODE_RE=/(?:^|[-\/\s])([A-Z])(\d+)(?=$|[-\/\s])/g;
const codeOf=p=>{const m=[...String(p).matchAll(CODE_RE)][0];return m?m[1]:""};
function blankState(){return {models:[],clients:[],orders:[],pos:[],grns:[],wos:[],issues:[],logs:[],fg:[],dispatches:[],components:[],cmoves:[],boms:[],mods:[],forecast:{months:3,avg:{}}}}
function seed(){return blankState()}
function migrate(){if(!S.forecast)S.forecast={months:3,avg:{}}}
/* ---------- lookups ---------- */
const client=id=>S.clients.find(c=>c.id===id)||{name:"(deleted client)",vendors:[]};
const vendor=(cid,vid)=>client(cid).vendors.find(v=>v.id===vid)||{name:"(vendor)",city:""};
const vLabel=(cid,vid)=>{const v=vendor(cid,vid);return v.name+(v.city?", "+v.city:"")};
const model=id=>S.models.find(m=>m.id===id);
const comp=p=>S.components.find(c=>c.id===p);
const cstock=p=>sum(S.cmoves.filter(m=>m.part===p),m=>m.qty);
const cdesc=p=>{const c=comp(p);return c?[c.desc,c.value].filter(Boolean).join(" · "):""};
const lineSent=id=>sum(S.dispatches.filter(d=>d.line===id),x=>x.qty);
function pendingLines(prod){
  const out=[];S.orders.filter(o=>!o.closed).forEach(o=>o.lines.forEach(l=>{if(prod&&l.product!==prod)return;const p=l.qty-lineSent(l.id);if(p>0)out.push({o,l,pending:p})}));
  return out.sort((a,b)=>(a.o.due||"9").localeCompare(b.o.due||"9")||a.o.date.localeCompare(b.o.date));
}
function orderStatus(o){if(o.closed)return "Closed";const q=sum(o.lines,l=>l.qty),s=sum(o.lines,l=>Math.min(l.qty,lineSent(l.id)));
  if(s>=q)return "Completed";if(o.due&&o.due<today())return "Overdue";return s>0?"Part dispatched":"Open"}
const soPill=s=>pill(s,{"Closed":"mute","Completed":"ok","Overdue":"bad","Part dispatched":"info","Open":"warn"}[s]);

/* ---------- purchase orders (multi-line, components) ---------- */
const poLineOpen=l=>Math.max(0,(+l.qty||0)-(+l.recv||0));
function poStatus(p){if(p.closed)return "Closed";const q=sum(p.lines,l=>l.qty),r=sum(p.lines,l=>Math.min(+l.recv||0,l.qty));if(q&&r>=q)return "Received";if(r>0)return "Part received";return p.status||"Ordered"}
const poOpen=p=>!["Received","Closed"].includes(poStatus(p));
const poValue=p=>sum(p.lines,l=>(+l.price||0)*l.qty);
function compIncoming(part){let order=0,transit=0;S.pos.filter(poOpen).forEach(p=>p.lines.forEach(l=>{if(l.part!==part)return;const o=poLineOpen(l);if(["Shipped","At Port / Customs"].includes(p.status))transit+=o;else order+=o}));return {order,transit,total:order+transit}}
const poPill=s=>pill(s,{Ordered:"mute",Shipped:"info","At Port / Customs":"warn","Part received":"info",Received:"ok",Closed:"mute"}[s]||"mute");

/* ---------- models: BOM, FG, work orders ---------- */
const fgProd=p=>sum(S.fg.filter(x=>x.product===p),x=>x.qty)-sum(S.dispatches.filter(d=>d.product===p),x=>x.qty);
function bomOfModel(m){const c=S.boms.filter(b=>b.product===m&&b.status!=="Obsolete");
  return c.sort((a,b)=>(b.status==="Released")-(a.status==="Released")||String(b.rev).localeCompare(String(a.rev),undefined,{numeric:true}))[0]}
function woBom(w){const b=bomOfModel(w.product);if(!b)return null;const m=w.mod?S.mods.find(x=>x.id===w.mod):null;const e=effBom(b,m?[m]:[]);return {b,m,items:e.items}}
function woInfo(w){
  const issued=sum(S.issues.filter(i=>i.wo===w.no),x=>x.sets);
  const handed=sum(S.fg.filter(i=>i.wo===w.no),x=>x.qty);
  const st=STAGES.map((_,k)=>{const L=S.logs.filter(l=>l.wo===w.no&&l.stage===k);return {pass:sum(L,x=>x.pass),fail:sum(L,x=>x.fail)}});
  const rej=sum(st,x=>x.fail);
  const status=w.closed?"Closed":(handed>=w.qty||(issued>=w.qty&&handed+rej>=issued))?"Completed":issued===0?"Awaiting materials":"In progress";
  const open=status!=="Closed"&&status!=="Completed";
  return {issued,handed,st,rej,pendingIssue:open?Math.max(0,w.qty-issued):0,canHand:Math.max(0,st[3].pass-handed),wip:Math.max(0,issued-handed-rej),status,remaining:open?Math.max(0,w.qty-handed):0};
}
const openWOs=()=>S.wos.filter(w=>{const s=woInfo(w).status;return s!=="Closed"&&s!=="Completed"});
const wipProd=p=>sum(S.wos.filter(w=>w.product===p),w=>woInfo(w).wip);
function planP(prod){
  const pls=pendingLines(prod),demand=sum(pls,x=>x.pending),fg=fgProd(prod);
  const inWO=sum(openWOs().filter(w=>w.product===prod),w=>woInfo(w).remaining);
  const orders=[...new Set(pls.map(x=>x.o.no))];
  return {pl:pls,demand,fg,inWO,toPlan:Math.max(0,demand-fg-inWO),orders,due:pls.map(x=>x.o.due).filter(Boolean).sort()[0]||"",
    clients:new Set(pls.map(x=>x.o.client)).size,vendors:new Set(pls.map(x=>x.o.client+x.l.vendor)).size};
}
/* component requirement (MRP): open WOs still to be issued + unplanned order demand, exploded through each model's BOM */
function compReq(extra){const need={},by={},noBom=new Set();
  const add=(prod,units,items)=>{items.forEach(i=>{const q=i.qty*units;need[i.part]=(need[i.part]||0)+q;(by[i.part]=by[i.part]||new Set()).add(prod)})};
  openWOs().forEach(w=>{const left=woInfo(w).pendingIssue;if(!left)return;const wb=woBom(w);if(!wb){noBom.add(w.product);return}add(w.product,left,wb.items)});
  S.models.forEach(m=>{const t=planP(m.id).toPlan;if(!t)return;const b=bomOfModel(m.id);if(!b){noBom.add(m.id);return}add(m.id,t,b.items)});
  (extra||[]).forEach(([prod,units])=>{if(!units)return;const b=bomOfModel(prod);if(!b){noBom.add(prod);return}add(prod,units,b.items)});
  const rows=Object.keys(need).map(part=>{const inc=compIncoming(part),stk=cstock(part);return {part,need:Math.ceil(need[part]),stock:stk,order:inc.order,transit:inc.transit,short:Math.max(0,Math.ceil(need[part])-stk-inc.total),models:[...by[part]]}}).sort((a,b)=>b.short-a.short||a.part.localeCompare(b.part));
  return {rows,noBom:[...noBom]}}
const woPill=s=>pill(s,{"Closed":"mute","Completed":"ok","Awaiting materials":"warn","In progress":"info"}[s]);
const dcPill=s=>pill(s,{"Packed":"warn","Dispatched":"info","In Transit":"info","Delivered":"ok"}[s]||"mute");
const woFor=w=>w.covers&&w.covers.length?"Clubbed: "+w.covers.join(", "):(w.note||"Stock");
const specOf=l=>(l.spec||"").trim();
const lineVal=l=>(+l.price||0)*l.qty;
const inr=n=>n?"₹"+(+n).toLocaleString("en-IN",{maximumFractionDigits:2}):"—";
const specBox=t=>t?`<span class="spec">${esc(t)}</span>`:"";
function specGroups(prod){const g={};pendingLines(prod).forEach(x=>{const k=specOf(x.l)||"(no specification)";g[k]=g[k]||{spec:k,qty:0,orders:new Set()};g[k].qty+=x.pending;g[k].orders.add(x.o.no)});return Object.values(g)}
function woSpecText(prod,covers,key){const parts=[];S.orders.filter(o=>(covers||[]).includes(o.no)).forEach(o=>{const sp=[...new Set(o.lines.filter(l=>l.product===prod).map(specOf).filter(Boolean))];if(key&&key!=="__all")return;sp.forEach(x=>parts.push(o.no+": "+x))});
  if(key&&key!=="__all")return key==="(no specification)"?"":key;return [...new Set(parts)].join(" | ")}
/* ---------- filters & links ---------- */
const F={q:"",model:"",client:""};
const qm=t=>!F.q||String(t).toLowerCase().includes(F.q.toLowerCase());
const fM=ms=>ms.filter(m=>!F.model||m.id===F.model);
const soText=o=>[o.no,o.cpo,client(o.client).name,...o.lines.map(l=>l.product+" "+vendor(o.client,l.vendor).name+" "+vendor(o.client,l.vendor).city)].join(" ");
const fSO=os=>os.filter(o=>(!F.client||o.client===F.client)&&(!F.model||o.lines.some(l=>l.product===F.model))&&qm(soText(o)));
const woClients=w=>S.orders.filter(o=>(w.covers||[]).includes(o.no)).map(o=>o.client);
const fWO=ws=>ws.filter(w=>(!F.model||w.product===F.model)&&(!F.client||woClients(w).includes(F.client))&&qm([w.no,w.product,woFor(w),w.spec].join(" ")));
const fPO=ps=>ps.filter(p=>qm([p.no,p.supplier,p.ref,...p.lines.map(l=>l.part+" "+cdesc(l.part))].join(" ")));
const fDC=ds=>ds.filter(d=>(!F.model||d.product===F.model)&&(!F.client||d.client===F.client)&&qm([d.no,d.so,d.product,d.inv,d.docket,d.courier,client(d.client).name,vLabel(d.client,d.vendor)].join(" ")));
const fRow=rs=>rs.filter(r=>{const m=r.product||(S.wos.find(w=>w.no===r.wo)||{}).product;return (!F.model||m===F.model)&&qm(JSON.stringify(r)+" "+m)});
const fPL=pls=>pls.filter(x=>(!F.client||x.o.client===F.client)&&(!F.model||x.l.product===F.model)&&qm(soText(x.o)));
const filtered=()=>!!(F.q||F.model||F.client);
const lnk=(k,id)=>`<button class="lnk" data-open="${k}:${esc(id)}">${esc(id)}</button>`;
/* ---------- table helper ---------- */
function table(cols,rows,emptyMsg,rowOpen){
  if(!rows.length)return `<div class="empty">${filtered()&&emptyMsg?"Nothing matches the current filter.":emptyMsg}</div>`;
  const grp=rows.some(r=>r.__group);
  return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${c.n?"n":""}" ${c.h&&!grp?'data-s="1" title="Sort"':""}>${c.h}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r=>r.__group?`<tr class="grp"><td colspan="${cols.length}">${r.__group}</td></tr>`:`<tr ${rowOpen?`data-open="${esc(rowOpen(r))}" tabindex="0"`:""}>${cols.map(c=>`<td class="${c.n?"n":""} ${c.cls||""}">${c.f(r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function card(title,desc,actions,body){return `<section class="card"><div class="card-h"><h2>${title}</h2>${actions||""}${desc?`<p>${desc}</p>`:""}</div>${body}</section>`}

function fieldHTML(x){const id="f_"+x.k;let inp;
  if(x.t==="select")inp=`<select id="${id}">${x.o.map(o=>{const v=typeof o==="object"?o.v:o,l=typeof o==="object"?o.l:o;return `<option value="${esc(v)}" ${v==x.v?"selected":""}>${esc(l)}</option>`}).join("")}</select>`;
  else if(x.t==="area")inp=`<textarea id="${id}" rows="${x.rows||3}">${esc(x.v)}</textarea>`;
  else inp=`<input id="${id}" type="${x.t||"text"}" value="${esc(x.v??"")}" ${x.t==="number"?'min="0" step="1" inputmode="numeric"':""}>`;

function form(title,fields,onSave,after){
  let html="",buf=[];
  fields.forEach(x=>{const h=fieldHTML(x);if(x.half){buf.push(h);if(buf.length===2){html+=`<div class="row2">${buf.join("")}</div>`;buf=[]}}else{html+=buf.join("")+h;buf=[]}});
  html+=buf.join("");
  modal(title,html);

  after&&after();

    const v={};for(const x of fields){let val=$("#f_"+x.k).value.trim();if(x.t==="number")val=val===""?"":Math.round(+val);if(x.req&&(val===""||val===null)){$("#merr").textContent=x.l+" is required.";return}v[x.k]=val}
    const err=onSave(v);if(err){$("#merr").textContent=err;return}

}

      {k:"qty",l:"WO qty",t:"number",v:qFor(opts[0]?opts[0].v:"__all"),req:1,hint:`Unplanned demand ${num(p.toPlan)} from ${p.orders.join(", ")||"—"} (${pl(p.vendors,"sub-vendor")}). ${bomOfModel(prod)?"BOM "+bomOfModel(prod).no:"No BOM yet: R&D must add one before Store can issue components"}`},

      v=>{if(v.qty<=0)return "WO qty must be more than 0.";const key=gs.length<=1?"__all":v.spec;
        const covers=key==="__all"?p.orders:[...((gs.find(g=>g.spec===key)||{}).orders||[])];
        S.wos.push({id:uid(),no:nextNo("WO",S.wos,"no"),product:prod,qty:v.qty,covers,specKey:key,spec:woSpecText(prod,covers,key),date:v.date,target:v.target,closed:false});toast(`WO created for ${num(v.qty)} × ${prod}`)},
      ()=>{$("#f_spec").onchange=()=>{$("#f_qty").value=qFor($("#f_spec").value)}})},
  log(woNo){const ws=S.wos.filter(x=>woInfo(x).issued>0&&!x.closed);if(!ws.length){toast("Store must issue materials to a work order first");return}
    const w=S.wos.find(x=>x.no===woNo)||ws[0];
    form("Log stage output",[
    {k:"wo",l:"Work order",t:"select",o:ws.map(x=>({v:x.no,l:`${x.no} · ${x.product}`})),v:w.no},
    {k:"stage",l:"Test stage",t:"select",o:STAGES.map((s,i)=>({v:i,l:(i+1)+". "+s})),hint:w.spec?"Spec for "+w.no+": "+esc(w.spec):""},
    {k:"pass",l:"Passed",t:"number",req:1,half:1},{k:"fail",l:"Failed",t:"number",v:0,half:1},
    {k:"date",l:"Date",t:"date",v:today()}],
    v=>{const W=S.wos.find(x=>x.no===v.wo),inf=woInfo(W),k=+v.stage;
      const input=k===0?inf.issued:inf.st[k-1].pass;const done=inf.st[k].pass+inf.st[k].fail;
      if(v.pass+(+v.fail||0)<=0)return "Enter passed or failed qty.";
      if(v.pass+(+v.fail||0)>input-done)return `Only ${num(input-done)} units are waiting at ${STAGES[k]} for ${W.no}.`;
      S.logs.push({id:uid(),date:v.date,wo:W.no,stage:k,pass:v.pass,fail:+v.fail||0,by:me()});toast(STAGES[k]+" logged")})},
  handover(woNo){const ws=S.wos.filter(x=>woInfo(x).canHand>0);if(!ws.length){toast("No final-tested units waiting for handover");return}
    const w=S.wos.find(x=>x.no===woNo&&woInfo(x).canHand>0)||ws[0];
    form("Hand over finished goods to Dispatch",[
    {k:"wo",l:"Work order",t:"select",o:ws.map(x=>({v:x.no,l:`${x.no} · ${x.product} · ready ${num(woInfo(x).canHand)}`})),v:w.no},
    {k:"qty",l:"Qty handed over",t:"number",v:woInfo(w).canHand,req:1},{k:"date",l:"Date",t:"date",v:today()}],
    v=>{const W=S.wos.find(x=>x.no===v.wo),c=woInfo(W).canHand;if(v.qty<=0||v.qty>c)return `Enter 1 to ${num(c)} (final-test passed, not yet handed over).`;
      S.fg.push({id:uid(),date:v.date,wo:W.no,product:W.product,qty:v.qty,by:me()});toast(num(v.qty)+" × "+W.product+" to Dispatch")})},
  closeWO(id){const w=S.wos.find(x=>x.id===id);w.closed=!w.closed;save();render();toast(w.no+(w.closed?" closed":" reopened"))},
  dispatch(lineId){
    const cand=pendingLines().filter(x=>fgProd(x.l.product)>0);
    if(!cand.length){toast("No finished goods for any pending sub-vendor line");return}
    const sel=cand.find(x=>x.l.id===lineId)||cand[0];
    const lab=x=>`${x.o.no} · ${client(x.o.client).name} → ${vLabel(x.o.client,x.l.vendor)} · ${x.l.product} · pending ${num(x.pending)}`;
    const sugg=x=>Math.min(x.pending,fgProd(x.l.product));
    form("Dispatch to sub-vendor",[
      {k:"line",l:"Order line (client → sub-vendor)",t:"select",o:cand.map(x=>({v:x.l.id,l:lab(x)})),v:sel.l.id},
      {k:"qty",l:"Qty",t:"number",req:1,v:sugg(sel),half:1,hint:"FG of this model: "+num(fgProd(sel.l.product))},{k:"date",l:"Date",t:"date",v:today(),half:1},
      {k:"inv",l:"Invoice no.",half:1},{k:"status",l:"Status",t:"select",o:DC_FLOW,half:1},
      {k:"courier",l:"Courier / transporter",half:1},{k:"docket",l:"Docket / LR no.",half:1}],
      v=>{const x=cand.find(c=>c.l.id===v.line),fg=fgProd(x.l.product),mx=Math.min(fg,x.pending);
        if(v.qty<=0||v.qty>mx)return `Max ${num(mx)} (pending ${num(x.pending)}, FG ${num(fg)}).`;
        S.dispatches.push({id:uid(),no:nextNo("DC",S.dispatches,"no"),date:v.date,so:x.o.no,line:x.l.id,client:x.o.client,vendor:x.l.vendor,product:x.l.product,qty:v.qty,price:+x.l.price||0,spec:specOf(x.l),inv:v.inv,courier:v.courier,docket:v.docket,status:v.status});
        toast(`${num(v.qty)} × ${x.l.product} to ${vendor(x.o.client,x.l.vendor).name}`)},
      ()=>{$("#f_line").onchange=()=>{const x=cand.find(c=>c.l.id===$("#f_line").value);$("#f_qty").value=sugg(x);$("#h_qty").textContent="FG of this model: "+num(fgProd(x.l.product))}});
  },
  editDC(id){const d=S.dispatches.find(x=>x.id===id);form("Update "+d.no,[
    {k:"inv",l:"Invoice no.",v:d.inv},{k:"courier",l:"Courier / transporter",v:d.courier,half:1},{k:"docket",l:"Docket / LR no.",v:d.docket,half:1},
    {k:"status",l:"Status",t:"select",o:DC_FLOW,v:d.status}],v=>{Object.assign(d,v);toast("Updated")})},
  clientF(id){const c=S.clients.find(x=>x.id===id);
    form(c?"Edit client":"Add client",[
      {k:"name",l:"Client name",v:c?.name,req:1,half:1},{k:"code",l:"Customer code",v:c?.code,half:1,hint:"Letter used in model names, e.g. C or B"},
      {k:"vendors",l:"Sub-vendors (one per line: Name, City)",t:"area",rows:6,v:c?c.vendors.map(v=>v.name+(v.city?", "+v.city:"")).join("\n"):"",hint:"Where this client's drivers are shipped to."}],
      v=>{const parsed=v.vendors.split("\n").map(s=>s.trim()).filter(Boolean).map(s=>{const i=s.lastIndexOf(",");return i>0?{name:s.slice(0,i).trim(),city:s.slice(i+1).trim()}:{name:s,city:""}});
        
        const old=c?c.vendors:[];
        const vs=parsed.map(p=>({id:(old.find(o=>o.name.toLowerCase()===p.name.toLowerCase())||{}).id||"v"+uid(),...p}));
        const used=new Set(S.orders.filter(o=>c&&o.client===c.id).flatMap(o=>o.lines.map(l=>l.vendor)));
        old.forEach(o=>{if(used.has(o.id)&&!vs.some(x=>x.id===o.id))vs.push(o)});
        const code=v.code.toUpperCase().slice(0,1);
        if(c){c.name=v.name;c.code=code;c.vendors=vs}else S.clients.push({id:"c"+uid(),name:v.name,code,vendors:vs});toast("Client saved")})},
  del(list,id){const r=S[list].find(x=>x.id===id);if(!r)return;
    if(list==="grns"){S.cmoves=S.cmoves.filter(m=>m.ref!==r.no);const p=S.pos.find(x=>x.no===r.po);if(p)r.lines.forEach(gl=>{const pl_=p.lines.find(l=>l.id===gl.line);if(pl_)pl_.recv=Math.max(0,(+pl_.recv||0)-gl.qty)})}
    if(list==="issues")S.cmoves=S.cmoves.filter(m=>m.ref!==r.no);
    S[list]=S[list].filter(x=>x.id!==id);save();render();toast("Entry deleted"+(list==="grns"||list==="issues"?" and component stock reversed":""))},
  reset(){modal("Delete all data",`<div class="hint" style="color:var(--bad);font-weight:600">This deletes every model, component, BOM, client, order, PO, work order, stock entry and dispatch for everyone using the app. It cannot be undone. Use Export all first if you need a copy.</div><div class="fl"><label for="delc">Type DELETE to confirm</label><input id="delc" autocomplete="off"></div>`);
    const b=$("#mf button[type=submit]");b.textContent="Delete all data";b.className="btn danger";
    $("#mf").onsubmit=e=>{e.preventDefault();if($("#delc").value.trim()!=="DELETE"){$("#merr").textContent="Type DELETE in capitals to confirm.";return}S=blankState();save();closeModal();DR=null;render();toast("All data deleted")}}
};


/* ---------- work orders (manual) ---------- */
A.newWO=()=>{if(!S.models.length){toast("Add models first (Masters)");return}form("New work order (manual)",[
    {k:"product",l:"Model",t:"select",o:S.models.map(m=>({v:m.id,l:m.id+(bomOfModel(m.id)?"":" · no BOM yet")}))},{k:"qty",l:"Planned qty",t:"number",req:1,half:1},
    {k:"note",l:"For",v:"Stock",half:1},
    {k:"date",l:"Start date",t:"date",v:today(),half:1},{k:"target",l:"Target date",t:"date",half:1}],
    v=>{if(v.qty<=0)return "Planned qty must be more than 0.";S.wos.push({id:uid(),no:nextNo("WO",S.wos,"no"),closed:false,covers:[],...v});toast("Work order created")})};

/* ---------- purchase orders (SCM): one supplier, many component lines ---------- */
const CUR=["INR","USD","CNY"];
const TXT='style="width:120px;text-align:left;font-family:var(--f-body)"';
function poLineRow(l={}){const x=esc,c=comp(l.part);return `<tr><td><input list="compDL" data-f="part" value="${x(l.part||"")}" ${TXT}></td><td class="sub" data-desc style="white-space:normal;min-width:170px">${x(cdesc(l.part)||(l.part?"Not in component master":""))}</td>
  <td class="n"><input type="number" min="0" step="1" data-f="qty" value="${x(l.qty??"")}" data-min="${+l.recv||0}"></td><td class="sub" data-unit>${x(c?c.unit:"")}</td><td class="n"><input type="number" min="0" step="0.0001" data-f="price" value="${x(l.price??"")}"></td>
  <td class="n" data-val>—</td><td class="sub">${l.recv?"recd "+num(l.recv):""}</td><td>${l.recv?"":`<button type="button" class="btn sm danger" data-rm>✕</button>`}<input type="hidden" data-f="id" value="${x(l.id||"")}"></td></tr>`}
function poForm(id,pre){const p=id?S.pos.find(x=>x.id===id):null;
  if(!S.components.length){toast("R&D must add components to the master first");return}
  let lines=p?p.lines:[];
  if(!p&&pre==="short")lines=compReq().rows.filter(r=>r.short>0).map(r=>({part:r.part,qty:r.short}));
  else if(!p&&pre==="fc")lines=fcCompRows().filter(r=>r.short>0).map(r=>({part:r.part,qty:r.short}));
  else if(!p&&pre&&String(pre).includes("|")){const [pt,q]=String(pre).split("|");lines=[{part:pt,qty:+q||""}]}
  const noShort=!p&&(pre==="short"||pre==="fc")&&!lines.length;
  if(!lines.length)lines=[{},{},{}];
  const last=S.pos[S.pos.length-1]||{};
  modal(p?"Edit "+p.no:"New purchase order",`
    <div class="row2" style="grid-template-columns:2fr 1fr 1fr"><div class="fl"><label for="pSup">Supplier</label><input id="pSup" list="supDL" value="${esc(p?p.supplier:last.supplier||"")}"><datalist id="supDL">${[...new Set(S.pos.map(x=>x.supplier))].map(v=>`<option value="${esc(v)}">`).join("")}</datalist></div>
    <div class="fl"><label for="pDate">PO date</label><input id="pDate" type="date" value="${p?p.date:today()}"></div><div class="fl"><label for="pEta">ETA at factory</label><input id="pEta" type="date" value="${p?p.eta||"":""}"></div></div>
    <div class="row2" style="grid-template-columns:2fr 1fr"><div class="fl"><label for="pRef">PI / container / BL ref</label><input id="pRef" value="${esc(p?p.ref:"")}"></div><div class="fl"><label for="pCur">Currency</label><select id="pCur">${CUR.map(c=>`<option ${c===(p?p.cur:last.cur||"INR")?"selected":""}>${c}</option>`).join("")}</select></div></div>
    <div class="fl"><label>Components</label>${noShort?'<div class="hint">Nothing is short right now (stock plus open POs cover the need). Add lines by hand if you still want to order.</div>':!p&&pre==="short"?'<div class="hint">Filled with every component short for open work orders and unplanned client orders. Remove what this supplier does not supply.</div>':!p&&pre==="fc"?'<div class="hint">Filled with the forecast shortfall.</div>':""}
    <div class="tw"><table class="mx" id="poT"><thead><tr><th>Part No.</th><th>Description</th><th class="n">Qty</th><th>Unit</th><th class="n">Price / unit</th><th class="n">Value</th><th></th><th></th></tr></thead><tbody>${lines.map(poLineRow).join("")}</tbody><tfoot><tr><td colspan="5"><b>Total</b></td><td class="n" id="poTot">—</td><td colspan="2"></td></tr></tfoot></table></div>
    <div class="acts" style="margin-top:6px"><button type="button" class="btn sm ghost" id="poAdd">+ Row</button></div></div>${compList()}`,true);
  const tb=$("#poT tbody");
  const calc=()=>{let t=0;[...tb.rows].forEach(tr=>{const q=+tr.querySelector('[data-f=qty]').value||0,pr=+tr.querySelector('[data-f=price]').value||0;tr.querySelector("[data-val]").textContent=q&&pr?num(Math.round(q*pr*100)/100):"—";t+=q*pr});$("#poTot").textContent=t?num(Math.round(t)):"—"};
  tb.addEventListener("input",e=>{if(e.target.dataset.f==="part"){const tr=e.target.closest("tr"),v=e.target.value.trim();tr.querySelector("[data-desc]").textContent=cdesc(v)||(v?"Not in component master":"");tr.querySelector("[data-unit]").textContent=comp(v)?comp(v).unit:""}calc()});
  tb.addEventListener("click",e=>{const b=e.target.closest("[data-rm]");if(b){b.closest("tr").remove();calc()}});
  $("#poAdd").onclick=()=>tb.insertAdjacentHTML("beforeend",poLineRow());calc();
  $("#mf").onsubmit=e=>{e.preventDefault();const sup=$("#pSup").value.trim();if(!sup){$("#merr").textContent="Enter the supplier.";return}
    const rows=[...tb.rows].map(tr=>({id:tr.querySelector('[data-f=id]').value,part:tr.querySelector('[data-f=part]').value.trim(),qty:Math.round(+tr.querySelector('[data-f=qty]').value||0),price:+tr.querySelector('[data-f=price]').value||0,min:+tr.querySelector('[data-f=qty]').dataset.min||0})).filter(r=>r.part);
    if(!rows.length){$("#merr").textContent="Add at least one component.";return}
    const unk=[...new Set(rows.filter(r=>!comp(r.part)).map(r=>r.part))];if(unk.length){$("#merr").textContent="Not in the component master: "+unk.join(", ");return}
    const bad=rows.find(r=>!(r.qty>0)||r.qty<r.min);if(bad){$("#merr").textContent=`Check qty for ${bad.part}${bad.min?` (already received ${num(bad.min)})`:""}.`;return}
    const old=p?p.lines:[];const nl=rows.map(r=>{const o=old.find(x=>x.id===r.id);return {id:o?o.id:uid(),part:r.part,qty:r.qty,price:r.price,recv:o?(+o.recv||0):0}});
    old.filter(o=>(+o.recv||0)>0&&!nl.some(n=>n.id===o.id)).forEach(o=>nl.push(o));
    const rec={supplier:sup,date:$("#pDate").value,eta:$("#pEta").value,ref:$("#pRef").value.trim(),cur:$("#pCur").value,lines:nl};
    if(p)Object.assign(p,rec);else S.pos.push({id:uid(),no:nextNo("PO",S.pos,"no"),status:"Ordered",closed:false,...rec});
    save();closeModal();render();toast(p?p.no+" saved":"PO created · "+pl(nl.length,"line"))}}
A.newPO=pre=>poForm(null,pre);
A.editPO=id=>poForm(id);
A.advancePO=id=>{const p=S.pos.find(x=>x.id===id);const i=PO_FLOW.indexOf(p.status);if(i>=PO_FLOW.length-1){toast("Store receives the goods with a GRN");return}
  if(!okFor("scm")){toast("View only · SCM updates PO status");return}const nx=PO_FLOW[i+1];
  if(nx==="Shipped"&&!p.ref)return form("Mark shipped · "+p.no,[{k:"ref",l:"Container / BL / AWB no.",req:1},{k:"eta",l:"Revised ETA",t:"date",v:p.eta}],v=>{Object.assign(p,v);p.status="Shipped";toast(p.no+" shipped")});
  p.status=nx;save();render();toast(p.no+" → "+nx)};
A.closePO=id=>{const p=S.pos.find(x=>x.id===id);p.closed=!p.closed;save();render();toast(p.no+(p.closed?" closed (balance cancelled)":" reopened"))};

/* ---------- goods receipt (Store) ---------- */
const gRow=()=>`<tr data-line=""><td><input list="compDL" data-f="part" ${TXT}></td><td class="sub" data-desc style="white-space:normal;min-width:170px"></td><td class="n"><input type="number" min="0" step="1" data-f="qty"></td><td class="n"><input type="number" min="0" step="1" data-f="dmg" value="0"></td></tr>`;
A.grn=poId=>{const p=poId?S.pos.find(x=>x.id===poId):null;
  if(p&&!poOpen(p)){toast(p.no+" is fully received");return}
  if(!S.components.length){toast("R&D must add components to the master first");return}
  const rows=p?p.lines.filter(l=>poLineOpen(l)>0):[];
  const body=p?rows.map(l=>`<tr data-line="${l.id}"><td><b>${esc(l.part)}</b><input type="hidden" data-f="part" value="${esc(l.part)}"></td><td class="sub" style="white-space:normal;min-width:170px">${esc(cdesc(l.part))}</td><td class="n">${num(poLineOpen(l))}</td><td class="n"><input type="number" min="0" step="1" data-f="qty" value="${poLineOpen(l)}"></td><td class="n"><input type="number" min="0" step="1" data-f="dmg" value="0"></td></tr>`).join(""):gRow()+gRow()+gRow();
  modal(p?"Goods receipt · "+p.no:"Goods receipt without PO",`
    <div class="row2" style="grid-template-columns:1fr 1fr 1fr"><div class="fl"><label for="gDate">Received on</label><input id="gDate" type="date" value="${today()}"></div><div class="fl"><label for="gInv">Supplier invoice / DC no.</label><input id="gInv"></div>${p?`<div class="fl"><label>Supplier</label><div>${esc(p.supplier)}</div></div>`:`<div class="fl"><label for="gSrc">Source</label><input id="gSrc" value="Local purchase"></div>`}</div>
    <div class="fl"><label>Components received</label><div class="hint">Received = total that arrived. Damaged / short is recorded for a supplier claim; the rest goes into component stock.</div>
    <div class="tw"><table class="mx" id="gT"><thead><tr><th>Part No.</th><th>Description</th>${p?'<th class="n">Open on PO</th>':""}<th class="n">Received</th><th class="n">Damaged / short</th></tr></thead><tbody>${body}</tbody></table></div>
    ${p?"":'<div class="acts" style="margin-top:6px"><button type="button" class="btn sm ghost" id="gAdd">+ Row</button></div>'}</div>${compList()}`,true);
  const tb=$("#gT tbody");tb.addEventListener("input",e=>{if(e.target.dataset.f==="part"){const tr=e.target.closest("tr");tr.querySelector("[data-desc]").textContent=cdesc(e.target.value.trim())||"Not in component master"}});
  if($("#gAdd"))$("#gAdd").onclick=()=>tb.insertAdjacentHTML("beforeend",gRow());
  $("#mf").onsubmit=e=>{e.preventDefault();const ls=[...tb.rows].map(tr=>({line:tr.dataset.line,part:tr.querySelector('[data-f=part]').value.trim(),qty:Math.round(+tr.querySelector('[data-f=qty]').value||0),dmg:Math.round(+tr.querySelector('[data-f=dmg]').value||0)})).filter(l=>l.part&&l.qty>0);
    if(!ls.length){$("#merr").textContent="Enter a received qty for at least one line.";return}
    for(const l of ls){if(!comp(l.part)){$("#merr").textContent=l.part+" is not in the component master.";return}if(l.dmg>l.qty){$("#merr").textContent="Damaged cannot be more than received ("+l.part+").";return}
      if(p){const o=poLineOpen(p.lines.find(x=>x.id===l.line));if(l.qty>Math.ceil(o*1.1)){$("#merr").textContent=`${l.part}: ${num(l.qty)} received is more than 10% over the open qty ${num(o)}.`;return}}}
    const g={id:uid(),no:nextNo("GRN",S.grns,"no"),date:$("#gDate").value||today(),po:p?p.no:($("#gSrc").value.trim()||"Local purchase"),supplier:p?p.supplier:"",inv:$("#gInv").value.trim(),lines:ls.map(l=>({line:l.line,part:l.part,qty:l.qty,dmg:l.dmg,ok:l.qty-l.dmg})),by:me()};
    S.grns.push(g);g.lines.forEach(l=>{if(p){const x=p.lines.find(y=>y.id===l.line);x.recv=(+x.recv||0)+l.qty}if(l.ok>0)S.cmoves.push({id:uid(),date:g.date,part:l.part,qty:l.ok,type:"Receipt (GRN)",ref:g.no,by:g.by})});
    save();closeModal();render();toast(`${g.no}: ${pl(g.lines.length,"line")} into stock`)}};

/* ---------- issue components to a work order (Store), per BOM ---------- */
A.issue=woNo=>{const ws=openWOs().filter(w=>woInfo(w).pendingIssue>0);if(!ws.length){toast("No work order is waiting for materials");return}
  const w=S.wos.find(x=>x.no===woNo&&woInfo(x).pendingIssue>0)||ws[0];
  modal("Issue components to production",`<div class="row2" style="grid-template-columns:2fr 1fr 1fr"><div class="fl"><label for="iWo">Work order</label><select id="iWo">${ws.map(x=>`<option value="${x.no}" ${x.no===w.no?"selected":""}>${x.no} · ${esc(x.product)} · to issue ${num(woInfo(x).pendingIssue)}</option>`).join("")}</select></div>
    <div class="fl"><label for="iSets">Units (sets) to issue</label><input id="iSets" type="number" min="1" step="1"></div><div class="fl"><label for="iDate">Date</label><input id="iDate" type="date" value="${today()}"></div></div>
    <div id="iBody"></div>`,true);
  let cur=null;
  const draw=()=>{const W=S.wos.find(x=>x.no===$("#iWo").value),inf=woInfo(W),wb=woBom(W);cur={W,wb};const can=wb&&wb.items.length?Math.max(0,Math.min(...wb.items.filter(i=>i.qty>0).map(i=>Math.floor(cstock(i.part)/i.qty)))):inf.pendingIssue;if($("#iSets").dataset.wo!==W.no){$("#iSets").value=can>0?Math.min(inf.pendingIssue,can):inf.pendingIssue;$("#iSets").dataset.wo=W.no}
    const n=+$("#iSets").value||0;
    $("#iBody").innerHTML=!wb?`<div class="note" style="background:var(--warn-bg)"><span><b>No BOM for ${esc(W.product)} yet.</b> You can still release units to production, but no component stock is deducted. Ask R&D to add the BOM.</span></div>`:
      `${can<inf.pendingIssue?`<div class="note" style="background:var(--warn-bg)"><span>Stock covers <b>${num(can)}</b> of the ${num(inf.pendingIssue)} units still to issue. Issue ${num(can)} now and the rest after the next GRN, or issue more with the short items marked.</span></div>`:""}<div class="hint">BOM ${esc(wb.b.no)}${wb.m?` + ${esc(wb.m.no)} (${esc(wb.m.title)})`:""}${W.spec?` · Spec: ${esc(W.spec)}`:""}</div><div class="tw"><table class="mx" id="iT"><thead><tr><th>Part No.</th><th>Description</th><th class="n">Per unit</th><th class="n">Required</th><th class="n">In stock</th><th class="n">Issue now</th></tr></thead><tbody>${
      wb.items.map(i=>{const req=Math.ceil(i.qty*n),st=cstock(i.part);return `<tr><td><b>${esc(i.part)}</b>${i._chg?"<br>"+specBox(i._chg):""}</td><td class="sub" style="white-space:normal">${esc(cdesc(i.part))}</td><td class="n">${i.qty}</td><td class="n">${num(req)}</td><td class="n" style="color:${st<req?"var(--bad)":"inherit"}">${num(st)}</td><td class="n"><input type="number" min="0" step="1" data-part="${esc(i.part)}" value="${Math.max(0,Math.min(req,st))}"></td></tr>`}).join("")}</tbody></table></div>`};
  draw();$("#iWo").onchange=draw;$("#iSets").onchange=draw;
  $("#mf").onsubmit=e=>{e.preventDefault();const {W,wb}=cur,n=Math.round(+$("#iSets").value||0),inf=woInfo(W);
    if(n<=0||n>inf.pendingIssue){$("#merr").textContent=`Units must be 1 to ${num(inf.pendingIssue)}.`;return}
    const ls=wb?[...document.querySelectorAll("#iT [data-part]")].map(i=>({part:i.dataset.part,qty:Math.round(+i.value||0)})).filter(l=>l.qty>0):[];
    const tot={};ls.forEach(l=>tot[l.part]=(tot[l.part]||0)+l.qty);for(const p in tot)if(tot[p]>cstock(p)){$("#merr").textContent=`Only ${num(cstock(p))} of ${p} in stock.`;return}
    const short=wb?[...new Set(wb.items.filter(i=>(tot[i.part]||0)<Math.ceil(i.qty*n)).map(i=>i.part))]:[];
    const is={id:uid(),no:nextNo("ISS",S.issues,"no"),date:$("#iDate").value||today(),wo:W.no,product:W.product,sets:n,bom:wb?wb.b.no+(wb.m?" + "+wb.m.no:""):"(no BOM)",lines:ls,short,by:me()};
    S.issues.push(is);ls.forEach(l=>S.cmoves.push({id:uid(),date:is.date,part:l.part,qty:-l.qty,type:"Issue to WO",ref:is.no,wo:W.no,by:is.by}));
    save();closeModal();render();toast(`${is.no}: ${num(n)} units' components to ${W.no}${short.length?" · short: "+short.join(", "):""}`)}};

const TABS=[["dash","Dashboard"],["ofind","Orders"],["orders","Order Entry"],["scm","SCM"],["store","Store"],["prod","Production"],["disp","Dispatch"],["fc","Forecast"],["rep","Reports"],["rnd","R&D / BOM"],["setup","Masters"]];
let tab="dash";try{tab=localStorage.getItem(KEY+"-tab")||"dash"}catch(e){}
if(/^#?(dash|ofind|orders|scm|store|prod|disp|fc|rep|rnd|setup)$/.test(location.hash))tab=location.hash.slice(1);
if(!TABS.some(t=>t[0]===tab))tab="dash";

function flowStrip(){const mon=today().slice(0,7);const mr=compReq();
  const pend=fPL(pendingLines()),sentM=sum(fDC(S.dispatches).filter(d=>d.date.startsWith(mon)),x=>x.qty);
  const openPO=S.pos.filter(poOpen),transitL=openPO.filter(p=>["Shipped","At Port / Customs"].includes(p.status)).length;
  const low=S.components.filter(c=>c.minStock&&cstock(c.id)<c.minStock).length,short=mr.rows.filter(r=>r.short>0).length;
  const ms=fM(S.models);
  const tile=(go,lab,val,em,tip)=>`<div class="ft" role="button" tabindex="0" data-go="${go}" title="${tip}"><span>${lab}</span><strong>${val}</strong><em>${em}</em></div>`;
  return `<div class="flow">`+
  tile("orders","Client orders · pending",num(sum(pend,x=>x.pending)),`${new Set(pend.map(x=>x.o.client+x.l.vendor)).size} sub-vendors waiting`,"Open Order Entry")+
  tile("scm","SCM · open POs",num(openPO.length),`${transitL} shipped / at port`,"Open SCM")+
  tile("store","Store · components short",num(short),`${low} below min stock`,"Open Store")+
  tile("prod","Production · WIP",num(sum(ms,m=>wipProd(m.id))),`${fWO(openWOs()).length} active WOs`,"Open Production")+
  tile("disp","FG ready",num(sum(ms,m=>fgProd(m.id))),"awaiting dispatch","Open Dispatch")+
  tile("disp","Dispatched",num(sentM),"this month","Open Dispatch")+`</div>`}

function alerts(){const a=[];const t=today();const mr=compReq();
  S.orders.forEach(o=>{if(orderStatus(o)==="Overdue"){const p=sum(o.lines,l=>Math.max(0,l.qty-lineSent(l.id)));a.push(["Order overdue","bad",`${o.no} · ${client(o.client).name} was due ${dmy(o.due)} · ${num(p)} drivers still to deliver`,`data-open="so:${o.no}"`,"Open order",o.client])}});
  S.models.forEach(m=>{const p=planP(m.id);if(p.toPlan>0)a.push(["Club & plan","info",`${m.id}: ${num(p.toPlan)} ordered but not in any WO (${pl(p.orders.length,"order")}, ${pl(p.vendors,"sub-vendor")})`,`data-a="club" data-id="${esc(m.id)}"`,"Club into WO",null,m.id])});
  const sh=mr.rows.filter(r=>r.short>0);if(sh.length)a.push(["Component shortfall","bad",`${pl(sh.length,"component")} short for open work orders and unplanned orders: ${sh.slice(0,4).map(r=>r.part+" ("+num(r.short)+")").join(", ")}${sh.length>4?"…":""}`,`data-a="newPO" data-id="short"`,"Raise PO",null,null]);
  mr.noBom.forEach(m=>a.push(["No BOM","warn",`${m} is ordered or in a WO but has no BOM, so its components can't be planned or issued`,`data-go="rnd"`,"R&D / BOM",null,m]));
  S.pos.filter(p=>poOpen(p)&&p.eta&&p.eta<t).forEach(p=>a.push(["ETA passed","warn",`${p.no} · ${p.supplier} (${pl(p.lines.length,"line")}) was due ${dmy(p.eta)} · ${poStatus(p)}`,`data-open="po:${p.id}"`,"Open PO",null,null]));
  S.wos.forEach(w=>{const i=woInfo(w);if(i.status==="Closed"||i.status==="Completed")return;
    if(i.pendingIssue>0)a.push(["Materials pending","warn",`${w.no} (${w.product}) still needs components for ${num(i.pendingIssue)} units from Store`,`data-a="issue" data-id="${w.no}"`,"Issue materials",null,w.product]);
    if(w.target&&w.target<t)a.push(["WO overdue","bad",`${w.no} (${w.product}) target was ${dmy(w.target)} · ${num(i.handed)}/${num(w.qty)} handed over`,`data-open="wo:${w.no}"`,"Open WO",null,w.product]);});
  S.dispatches.filter(d=>d.status==="Packed").forEach(d=>a.push(["Not shipped","info",`${d.no} (${d.product}) to ${vendor(d.client,d.vendor).name} is packed${d.inv?"":" · invoice no. missing"}`,`data-a="editDC" data-id="${d.id}"`,"Update",d.client,d.product]));
  S.components.forEach(c=>{if(c.minStock&&cstock(c.id)<c.minStock)a.push(["Component low","warn",`${c.id} ${c.desc}: ${num(cstock(c.id))} ${c.unit} in stock, min ${num(c.minStock)}`,`data-go="store"`,"View",null,null])});
  const rank={bad:0,warn:1,info:2};
  return a.filter(x=>qm(x[2])&&(!F.model||x[6]===F.model||(x[6]==null&&x[2].includes(F.model)))&&(!F.client||x[5]===F.client||x[2].includes(client(F.client).name))).sort((x,y)=>rank[x[1]]-rank[y[1]]);
}
const alertLi=x=>`<li ${x[3]} tabindex="0" role="button">${pill(x[0],x[1])}<span>${esc(x[2])}</span><span class="go">${x[4]} →</span></li>`;

function stagesCell(w){const i=woInfo(w);return `<div class="stages">${i.st.map((s,k)=>`<div class="stg" title="${STAGES[k]}">${STAGES[k].split(" ")[0]}<div class="tr"><i style="width:${Math.min(100,s.pass/w.qty*100)}%"></i></div><b>${num(s.pass)}</b>${s.fail?` <span class="f">✕${s.fail}</span>`:""}</div>`).join("")}</div>`}
const bomTag=m=>{const b=bomOfModel(m);return b?`<span class="sub">${esc(b.no)}${b.status!=="Released"?" · "+b.status:""}</span>`:pill("No BOM","warn")};
function canBuild(w){const wb=woBom(w);if(!wb||!wb.items.length)return null;return Math.min(...wb.items.map(i=>i.qty>0?Math.floor(cstock(i.part)/i.qty):Infinity))}

function orderBlock(o){
  const c=client(o.client),vids=[...new Set(o.lines.map(l=>l.vendor))],prods=[...new Set(o.lines.map(l=>l.product))];
  const q=sum(o.lines,l=>l.qty),s=sum(o.lines,l=>Math.min(l.qty,lineSent(l.id))),st=orderStatus(o),val=sum(o.lines,lineVal);

    <div class="acts"><button class="btn sm ghost" data-a="editSO" data-id="${o.id}">Price & spec</button><button class="btn sm ghost" data-a="toggleSO" data-id="${o.id}">${o.closed?"Reopen":"Close"}</button><button class="btn sm danger" data-a="delSO" data-id="${o.id}">Delete</button></div></div>
    <div class="tw"><table><thead><tr><th>Model</th>${one?`<th class="n">Delivered / PO Qty</th>`:vids.map(v=>`<th class="n">${esc(vendor(o.client,v).name)}<div class="sub" style="text-transform:none;letter-spacing:0;font-weight:400">${esc(vendor(o.client,v).city)}</div></th>`).join("")+`<th class="n">Total qty</th>`}<th class="n">Price ₹/pc</th><th class="n">Value ₹</th><th>Specification</th></tr></thead>

    ${val?`<tfoot><tr><td><b>Order value</b></td>${one?"":vids.map(()=>"<td></td>").join("")}<td class="n"><b>${num(q)}</b></td><td></td><td class="n"><b>${num(Math.round(val))}</b></td><td></td></tr></tfoot>`:""}</table></div></div>`;
}

const poCols=[{h:"PO no.",f:p=>`<b>${esc(p.no)}</b>`},{h:"Supplier",f:p=>esc(p.supplier)},{h:"Lines",n:1,f:p=>p.lines.length},{h:"Open qty",n:1,f:p=>num(sum(p.lines,poLineOpen))},{h:"Value",n:1,f:p=>poValue(p)?(p.cur||"INR")+" "+num(Math.round(poValue(p))):"—"},

const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function monLabel(i){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+1+i);return MON[d.getMonth()]+" "+String(d.getFullYear()).slice(2)}
function actualAvg(p){const from=new Date(Date.now()-90*864e5).toISOString().slice(0,10);return Math.round(sum(S.dispatches.filter(d=>d.product===p&&d.date>=from),x=>x.qty)/3)}
function fcModel(m){const n=S.forecast.months,avg=S.forecast.avg[m.id]||0,pp=planP(m.id),wip=wipProd(m.id);
  const fc=avg*n,need=Math.max(fc,pp.demand),build=Math.max(0,need-pp.fg-wip);
  return {m,avg,fc,pend:pp.demand,fg:pp.fg,wip,need,build,bom:bomOfModel(m.id)}}
function fcCompRows(){const n=S.forecast.months,agg={};
  S.models.map(fcModel).forEach(r=>{if(!r.bom)return;r.bom.items.forEach(i=>{const a=agg[i.part]=agg[i.part]||{part:i.part,need:0,monthly:0,models:new Set()};a.need+=i.qty*r.build;a.monthly+=i.qty*r.avg;if(r.build||r.avg)a.models.add(r.m.id)})});
  return Object.values(agg).filter(a=>a.need||a.monthly).map(a=>{const stk=cstock(a.part),inc=compIncoming(a.part).total,avail=stk+inc;
    return {...a,need:Math.ceil(a.need),stock:stk,inc,avail,short:Math.max(0,Math.ceil(a.need)-avail),cover:a.monthly?avail/a.monthly:null,proj:Array.from({length:Math.min(n,12)},(_,k)=>Math.round(avail-a.monthly*(k+1))),models:[...a.models]}})
    .sort((x,y)=>y.short-x.short||(x.cover??1e9)-(y.cover??1e9))}
function fcKitCard(){const n=S.forecast.months,rows=fcCompRows(),short=rows.filter(r=>r.short>0),noBom=S.models.map(fcModel).filter(r=>(r.build||r.avg)&&!r.bom);

  const byV={};dcs.forEach(d=>{const k=d.client+"|"+d.vendor+"|"+d.product;byV[k]=byV[k]||{d,qty:0,n:0};byV[k].qty+=d.qty;byV[k].n++});
  return {dcs,newL,pend,logs,byV:Object.values(byV)};

function toBlob(sheets){
  if(!window.XLSX)throw new Error("Excel library did not load. Check the internet connection and reload.");
  const wb=XLSX.utils.book_new(),used=new Set();
  sheets.forEach(([name,rows])=>{let nm=name.replace(/[\\\/?*\[\]:]/g,"-").slice(0,31);let i=2;while(used.has(nm))nm=nm.slice(0,28)+" "+i++;used.add(nm);
    const ws=rows.length?XLSX.utils.json_to_sheet(rows):XLSX.utils.aoa_to_sheet([["No entries"]]);
    if(rows.length){const keys=Object.keys(rows[0]);ws["!cols"]=keys.map(k=>({wch:Math.min(40,Math.max(k.length,...rows.slice(0,200).map(r=>String(r[k]??"").length))+2)}))}
    XLSX.utils.book_append_sheet(wb,ws,nm)});
  return new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
}
async function saveXlsx(filename,sheets){
  let blob;try{blob=toBlob(sheets)}catch(e){toast(e.message);return}
  if(DL){try{await DL.save({filename,data:blob});toast("Saved "+filename)}catch(e){if(e&&e.code==="declined")return;toast(e&&e.code==="rate_limited"?"A save is already open. Try again in a moment.":"Could not save the file ("+(e&&e.code||"error")+").")}return}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Downloading "+filename)}catch(e){toast("Download is blocked in this view.")}
}

async function saveBlob(filename,blob){

const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function toDate(v){if(v==null||v==="")return "";if(v instanceof Date&&!isNaN(v))return ymd(new Date(v.getTime()+12*36e5));
  if(typeof v==="number"){const d=new Date(Math.round((v-25569)*864e5));return ymd(new Date(d.getTime()+d.getTimezoneOffset()*6e4))}
  const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);if(m)return `${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`;
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:"?"}

    if(vn&&!c.vendors.some(v=>v.name.toLowerCase()===vn.toLowerCase()))c.vendors.push({id:"v"+uid(),name:vn,city:str(r["city"])})});

    else if(P.supplier&&str(r["supplier"])&&P.supplier!==str(r["supplier"]))return bad("Open POs",r,`PO ${no} has two different suppliers`);

const APP_VERSION="2.0.0 (01/10/2026)";
const COLS=["models","clients","orders","pos","grns","wos","issues","logs","fg","dispatches","components","cmoves","boms","mods"];
let MODE="local",FB=null,LAST={},READY=false,tsC=0,pendingR=false;
const did=id=>encodeURIComponent(String(id)).replace(/\./g,"%2E");
function stable(o){if(Array.isArray(o))return "["+o.map(stable).join(",")+"]";if(o&&typeof o==="object")return "{"+Object.keys(o).filter(k=>o[k]!==undefined).sort().map(k=>JSON.stringify(k)+":"+stable(o[k])).join(",")+"}";return JSON.stringify(o===undefined?null:o)}
const clean=o=>JSON.parse(JSON.stringify(o));
function setSync(state,msg){const el=$("#sync");if(!el)return;el.className="sync "+state;el.textContent=msg}
function save(){
  if(MODE!=="fb")return;
  if(!navigator.onLine){toast("No internet: this change was not sent to the cloud. Reload when back online.");setSync("bad","Offline · not saved");return}
  const ops=[];
  COLS.forEach(c=>{if(!canWrite(c))return;const cur=new Map();(S[c]||[]).forEach(r=>{if(r._ts==null)r._ts=Date.now()*1000+(tsC++%1000);const j=stable(r);cur.set(String(r.id),j);if((LAST[c]&&LAST[c].get(String(r.id)))!==j)ops.push(["set",c,r])});
    (LAST[c]||new Map()).forEach((j,id)=>{if(!cur.has(id))ops.push(["del",c,id])});LAST[c]=cur});
  const fj=stable(S.forecast||{});if(canWrite("__meta")&&fj!==LAST.__f){ops.push(["meta"]);LAST.__f=fj}
  if(!ops.length)return;
  setSync("busy","Saving…");
  const jobs=[];for(let i=0;i<ops.length;i+=400){const b=FB.writeBatch(FB.db);ops.slice(i,i+400).forEach(([t,c,r])=>{
    if(t==="set")b.set(FB.doc(FB.db,"pf_"+c,did(r.id)),clean(r));else if(t==="del")b.delete(FB.doc(FB.db,"pf_"+c,did(r)));else b.set(FB.doc(FB.db,"pf_meta","settings"),{forecast:clean(S.forecast||{months:3,avg:{}})})});jobs.push(b.commit())}
  Promise.all(jobs).then(()=>setSync("ok","Saved to cloud")).catch(e=>{setSync("bad","Not saved");toast("Could not save to the shared database: "+e.message)});
}
const busyInput=()=>{const a=document.activeElement;return !!(a&&a.closest&&a.closest("#app")&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))};
function liveRender(){if(!READY)return;if(busyInput()){pendingR=true;return}render()}
document.addEventListener("focusout",()=>{if(pendingR)setTimeout(()=>{if(!busyInput()){pendingR=false;render()}},60)});
function startFirebase(){
  const got=new Set(),need=COLS.length+1;
  const done=k=>{got.add(k);if(!READY&&got.size>=need){READY=true;migrate();render();setSync(navigator.onLine?"ok":"bad",navigator.onLine?"Cloud · live":"Offline · view only")}else liveRender()};
  S=blankState();
  COLS.forEach(c=>FB.onSnapshot(FB.collection(FB.db,"pf_"+c),snap=>{const arr=snap.docs.map(d=>d.data()).sort((a,b)=>(a._ts||0)-(b._ts||0));S[c]=arr;LAST[c]=new Map(arr.map(r=>[String(r.id),stable(r)]));done(c)},e=>fatal("Could not read "+c+": "+e.message)));
  FB.onSnapshot(FB.doc(FB.db,"pf_meta","settings"),d=>{S.forecast=d.exists()&&d.data().forecast?d.data().forecast:{months:3,avg:{}};LAST.__f=stable(S.forecast);done("__meta")},e=>fatal("Could not read settings: "+e.message));
}

  (mods||[]).forEach(m=>m.changes.forEach(c=>{const at=()=>items.findIndex(i=>i.part===c.part&&(!c.ref||!i.ref||i.ref===c.ref));

      if(c.type==="Remove")items.splice(k,1);

  tb.addEventListener("input",e=>{if(e.target.dataset.f!=="part"||kind!=="bom")return;const tr=e.target.closest("tr"),p=e.target.value.trim();tr.querySelector("[data-desc]").textContent=cdesc(p)||(p?"Not in component master":"");tr.querySelector("[data-unit]").textContent=comp(p)?.unit||""});

document.addEventListener("change",async e=>{if(e.target.id!=="compFile"||!e.target.files[0])return;const f=e.target.files[0];
  try{const wb=XLSX.read(await f.arrayBuffer());const ws=wb.Sheets["Components"]||wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{defval:""}).map((r,i)=>{const o={_row:i+2};for(const k in r)o[k.replace(/\*/g,"").trim().toLowerCase()]=typeof r[k]==="string"?r[k].trim():r[k];return o}).filter(o=>String(o["part no."]||"").trim()!=="");

      if(M)(c?upd:add).push({p,r});
      const q=r["stock qty"];if(St&&q!==""&&q!=null){const n=Math.round(+String(q).replace(/,/g,""));if(!isFinite(n)||n<0){err.push(`Row ${r._row}: Stock Qty "${q}" is not valid`);return}const cur=c?cstock(p):0;if(n!==cur)stk.push({p,d:n-cur,n})}});
    const inner=`<div class="hint">${esc(f.name)} · importing as <b>${ROLES[ROLE]}</b></div>${kp([["New parts",add.length],["Master updates",upd.length],["Stock changes",stk.length],["Problems",err.length]])}

    m.changes.map((c,k)=>[k+1,c.type,c.type==="Add"?(c.newPart||c.part):c.part,cdesc(c.type==="Add"?(c.newPart||c.part):c.part),c.type==="Replace"?c.newPart:"",c.type==="Replace"?cdesc(c.newPart):"",c.qty===""||c.qty==null?"":String(c.qty),c.ref||"",c.remarks||""]),
    {fill:k=>({Add:[228,243,222],Remove:[251,227,225],Replace:[253,240,216],"Change qty":[224,238,246]}[m.changes[k].type])});}

  return card("BOMs","Component bill of materials per model. Releasing a new revision makes the older one Obsolete. Tap a BOM to see its lines, modifications and PDF exports.",`<button class="btn" data-a="bomNew">+ New BOM</button>`,

  const dir=th.dataset.dir==="asc"?"desc":"asc";th.parentNode.querySelectorAll("th").forEach(x=>delete x.dataset.dir);th.dataset.dir=dir;
  const key=tr=>{const t=(tr.children[idx]?.innerText||"").trim().split("\n")[0];const d=t.match(/^(\d{2})\/(\d{2})\/(\d{4})/);if(d)return +(d[3]+d[2]+d[1]);if(t==="—")return -Infinity;const n=t.replace(/[,%\s]/g,"");return /^-?\d+(\.\d+)?$/.test(n)?+n:t.toLowerCase()};
  const rows=[...tb.rows].sort((a,b)=>{const x=key(a),y=key(b);const c=typeof x===typeof y?(x>y?1:x<y?-1:0):(typeof x==="number"?-1:1);return dir==="asc"?c:-c});
  rows.forEach(r=>tb.appendChild(r));}
document.addEventListener("click",e=>{
  if(e.target.closest("#modalRoot"))return;
  const t=e.target.closest("[data-tab],[data-go],[data-a],[data-del],[data-open],[data-close],th[data-s]");if(!t)return;
  if(t.matches("th[data-s]"))return sortTh(t);
  if(t.dataset.close)return closeD();
  if(t.dataset.open)return openD(t.dataset.open);
  if(t.dataset.tab||t.dataset.go){DR=null;tab=t.dataset.tab||t.dataset.go;try{localStorage.setItem(KEY+"-tab",tab)}catch(_){}render();window.scrollTo(0,0);return}
  if(t.dataset.del){if(!okFor(DEL_OWN[t.dataset.del])){toast("View only · "+ROLES[DEL_OWN[t.dataset.del]]+" edits this");return}return A.del(t.dataset.del,t.dataset.id)}
  const a=t.dataset.a,id=t.dataset.id;if(!can(a)){toast(navigator.onLine?"View only · "+ownerName(a)+" edits this":"No internet. Changes are paused until the connection is back.");return}
  if(a==="grn")return A.grn(null);
  A[a](id);
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if($("#modalRoot").innerHTML)return closeModal();if(DR)return closeD()}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches('[tabindex="0"][data-open],[tabindex="0"][data-go],[tabindex="0"][data-a]')){e.preventDefault();e.target.click()}
});
let qT;$("#fq").addEventListener("input",()=>{clearTimeout(qT);qT=setTimeout(()=>{F.q=$("#fq").value.trim();render()},200)});
$("#fm").addEventListener("change",()=>{F.model=$("#fm").value;render()});
$("#fc").addEventListener("change",()=>{F.client=$("#fc").value;render()});
$("#fclr").addEventListener("click",()=>{F.q=F.model=F.client="";$("#fq").value="";render()});
try{const u=JSON.parse(localStorage.getItem(KEY+"-user")||"{}");if(u.n)$("#uName").value=u.n}catch(e){}
$("#uName").addEventListener("change",()=>{try{localStorage.setItem(KEY+"-user",JSON.stringify({n:$("#uName").value}))}catch(e){}});
$("#signOut").addEventListener("click",signOutNow);
$("#appVer").textContent=APP_VERSION;boot();
</script>
